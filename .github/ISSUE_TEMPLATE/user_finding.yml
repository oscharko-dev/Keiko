name: User Finding
description: Report a bug or defect found while using Keiko.
labels: ["type: user-finding", "bug", "status: new"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs found by pilot or production users.

        **If you believe you have found a security vulnerability or a data-loss issue, do not describe it here.** Report it privately through [GitHub Security Advisories](https://github.com/oscharko-dev/Keiko/security/advisories/new), as [SECURITY.md](https://github.com/oscharko-dev/Keiko/blob/dev/SECURITY.md) requires. This form is public, so anything filed here is disclosed before a fix exists. The `Data loss or security concern` impact option below is for a finding whose security relevance only becomes clear later — it is not a private channel.

        Do not include API keys, customer data, private screenshots, internal model endpoints, private logs, or other secrets. Redact sensitive values before submitting.

        Maintainers and agents must track this finding in the public Keiko Product Delivery project. New reports start with project `Status` = `Open Issues`, `Workflow State` = `New`, and label `status: new`. When an agent claims the finding, it must set `Status` and `Workflow State` to `In Progress`, fill `Owner / Agent`, `Branch`, `Pull Request`, and keep `Human Review Required` set to `No`. While review findings or deterministic gates settle, use `Workflow State` = `PR Open` and label `status: in progress`; mark `Done` only after verified auto-merge, closure evidence, and issue closure.

  - type: input
    id: version
    attributes:
      label: Keiko version
      description: Enter the installed Keiko version.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the operating system where the issue occurred.
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Enter the browser and version if the UI is involved.
      placeholder: e.g. Chrome 125

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps needed to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add redacted screenshots, console output, or logs if available.
      placeholder: Redacted evidence only. Do not include secrets or customer data.

  - type: dropdown
    id: user_impact
    attributes:
      label: User impact
      description: Select the highest observed impact.
      options:
        - Degrades core workflow
        - Degrades secondary workflow
        - Cosmetic or minor
        - Data loss or security concern
    validations:
      required: true

  - type: textarea
    id: maintainer_triage
    attributes:
      label: Maintainer release impact triage
      description: "Maintainers and agents only. Reporters may leave this blank."
      value: |
        Release-note category: 
        Priority: 
        User-visible change: 
        Release-note bullet: 
        Supported-from versions: 
        Affected state stores: 
        User action required and remediation: 
        Internal-only rationale:

  - type: checkboxes
    id: submission_safety
    attributes:
      label: Submission safety
      options:
        - label: I have removed secrets, API keys, customer data, private endpoints, and private logs from this report.
          required: true
