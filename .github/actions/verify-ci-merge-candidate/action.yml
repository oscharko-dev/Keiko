name: Verify CI merge candidate
description: Run the merge-candidate validator from an immutable repository revision.
inputs:
  base-sha:
    description: Pull-request base commit SHA.
    required: true
  head-sha:
    description: Pull-request head commit SHA.
    required: true
runs:
  using: composite
  steps:
    - name: Verify exact GitHub merge revision
      shell: bash
      env:
        KEIKO_CANDIDATE_BASE_SHA: ${{ inputs.base-sha }}
        KEIKO_CANDIDATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/check-ci-merge-candidate.mjs"
