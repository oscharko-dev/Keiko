name: Verify Sonar analysis log
description: Validate scanner evidence using code from an immutable repository revision.
inputs:
  log-path:
    description: Absolute path to the scanner log produced by the candidate analysis.
    required: true
runs:
  using: composite
  steps:
    - name: Verify full-analysis evidence
      shell: bash
      env:
        KEIKO_SONAR_LOG_PATH: ${{ inputs.log-path }}
      run: >-
        node "$GITHUB_ACTION_PATH/../../../scripts/check-sonar-analysis-log.mjs"
        --log "$KEIKO_SONAR_LOG_PATH"
        --require-full-analysis
