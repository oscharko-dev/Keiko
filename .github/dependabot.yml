version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # One pull request per day for every npm version update (owner decision, 2026-09-25): thirteen
      # single-bump pull requests each ran a full required-check matrix and filled the free plan's
      # 20-job hosted-runner queue ahead of a release publish. Security updates keep their own group.
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # The Vitest 5 major is deferred by a reviewed disposition (docs/release/2296-dependency-security-
      # closeout.md, "major-deferred", #3474): Stryker 10 with Vitest 5 reports zero killed mutants, so
      # the security mutation evidence would be meaningless. Dependabot must stop reopening it until
      # that lane proves non-zero kills; minor and patch updates on the 4.x line stay proposed.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is `major-deferred` in the same closeout document (the programmatic API lane,
      # #2269/#2270). Proposed inside the daily group it made `npm ci` fail with ERESOLVE in every
      # job, because typescript-eslint 8.x accepts `typescript >=4.8.4 <6.1.0`; the whole group's
      # other updates never got measured. Minor and patch updates on the 6.x line stay proposed.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Majors with their own child of epic #4377 ("one child, one major; never in a routine batch").
      # Folded into group PR #4514 they turned the whole day's batch red: mermaid 12 (#4378) also adds
      # elkjs, whose EPL-2.0 OR GPL-3.0-or-later license the dependency review rejects; entities 9
      # (#4379); jsdom 31 (#4517) changes two keiko-editor test outcomes. Minor and patch stay proposed.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
      - dependency-name: entities
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      # axe-core is MPL-2.0. The unchanged permissive-only dependency review rejects every changed
      # version, so the closeout document retains 4.12.1 (`axe-core` row). No license exception is added.
      - dependency-name: axe-core
        versions: [">4.12.1"]
      # PDF.js 6.4+ fails the unchanged browser-baseline gate; its separate qualification is #4518.
      - dependency-name: pdfjs-dist
        versions: [">=6.4.0"]
      # Playwright 1.65's Firefox build crashes the memory-journal Firefox smoke page (#4524).
      - dependency-name: "@playwright/test"
        versions: [">=1.65.0"]
      # knip past 6.41.0 reports UI dead exports whose removal touches five large UI files; the
      # changed-file SonarJS step reports their legacy findings although SonarCloud does not (#4525).
      - dependency-name: knip
        versions: [">6.41.0"]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Same owner decision for pinned actions: one pull request per day carrying every action bump,
      # which also keeps `github/codeql-action/init` and `/analyze` moving together (the closeout
      # document records why a one-sided CodeQL bump is a problem).
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
