name: Banking Quality Gate

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Base-controlled metadata-only gate; no PR checkout, cache, artifact, environment, or command input.
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  publish-banking-gate:
    name: Publish Banking gate
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted gate implementation from protected base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Publish commit-bound Banking Quality Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-banking-quality-gate.mjs
