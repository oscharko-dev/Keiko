name: CI

on:
  push:
    branches:
      - dev
      - feat/dev
      - feat/epic-open-code-engine-in-keiko-2473
      - feat/keiko-editor
      - feat/keiko-agent-native-editor-foundation-and-runtime
      - feat/prompt-enhancer-1307
      - feat/keiko-establish-governed-end-to-end-git-delivery
      - feat/keiko-voice-digital-twin
      - feat/keiko-isolated-task-workspaces
      - feat/keiko-colleague-like-voice-dialogue-mode
      - feat/keiko-repository-centered-desktop-workflow
      - feat/epic-built-in-editor-2285-M11
      - feat/epic-memoria-viva-2538
      - epic/coding-workbench-opencode-codex
      - "release/**"
  pull_request:
    branches:
      - dev
      - feat/dev
      - feat/epic-open-code-engine-in-keiko-2473
      - feat/keiko-editor
      - feat/keiko-agent-native-editor-foundation-and-runtime
      - feat/prompt-enhancer-1307
      - feat/keiko-establish-governed-end-to-end-git-delivery
      - feat/keiko-voice-digital-twin
      - feat/keiko-isolated-task-workspaces
      - feat/keiko-colleague-like-voice-dialogue-mode
      - feat/keiko-repository-centered-desktop-workflow
      - feat/epic-built-in-editor-2285-M11
      - feat/epic-memoria-viva-2538
      - epic/coding-workbench-opencode-codex
      - "release/**"
  # ADR-0139 D7: every required workflow also validates merge-queue groups so a human can
  # enable GitHub's merge queue without agents re-racing a moving dev branch.
  merge_group:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

# A superseded pull-request run has no consumer left: its evidence binds a head commit that the
# next push already replaced, and branch protection only ever reads the current head. Cancelling it
# frees the runners the replacement run is queued behind.
#
# Everything that is not a pull request gets a group of ONE — `github.run_id` is unique per run — so
# it is never grouped with another run and can never be cancelled by one. `cancel-in-progress: false`
# would NOT be enough: GitHub cancels a previously *pending* run in a group whenever a newer run
# enters it, regardless of that flag, so a shared `refs/heads/dev` group would drop the middle run
# of three merges landing inside one CI window. A cancelled required check on `dev` is
# indistinguishable from a real defect, and that evidence binds an integration commit nothing else
# re-measures (Issue #2704).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protected-branch-gate:
    name: Protected branch gate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm dev branch gate
        run: |
          case "${GITHUB_REF}:${GITHUB_BASE_REF}" in
            refs/heads/dev: | refs/heads/feat/dev: | refs/heads/feat/epic-open-code-engine-in-keiko-2473: | refs/heads/feat/keiko-editor: | refs/heads/feat/keiko-agent-native-editor-foundation-and-runtime: | refs/heads/feat/prompt-enhancer-1307: | refs/heads/feat/keiko-establish-governed-end-to-end-git-delivery: | refs/heads/feat/keiko-voice-digital-twin: | refs/heads/feat/keiko-isolated-task-workspaces: | refs/heads/feat/keiko-colleague-like-voice-dialogue-mode: | refs/heads/feat/keiko-repository-centered-desktop-workflow: | refs/heads/feat/epic-built-in-editor-2285-M11: | refs/heads/feat/epic-memoria-viva-2538: | refs/heads/epic/coding-workbench-opencode-codex: | refs/heads/release/*: | *:dev | *:feat/dev | *:feat/epic-open-code-engine-in-keiko-2473 | *:feat/keiko-editor | *:feat/keiko-agent-native-editor-foundation-and-runtime | *:feat/prompt-enhancer-1307 | *:feat/keiko-establish-governed-end-to-end-git-delivery | *:feat/keiko-voice-digital-twin | *:feat/keiko-isolated-task-workspaces | *:feat/keiko-colleague-like-voice-dialogue-mode | *:feat/keiko-repository-centered-desktop-workflow | *:feat/epic-built-in-editor-2285-M11 | *:feat/epic-memoria-viva-2538 | *:epic/coding-workbench-opencode-codex | *:release/*)
              echo "Protected or integration branch gate satisfied."
              ;;
            *)
              echo "This gate is only valid for protected dev, integration, and release branches."
              exit 1
              ;;
          esac

  # Classifies the change set so the expensive cross-platform matrix can be skipped for changes that
  # cannot affect it. Allow-listed and fail-open: an unrecognised path, an unresolvable base, or any
  # error yields false and the full matrix runs (#2699).
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      documentation-only: ${{ steps.classify.outputs.documentation-only }}
    steps:
      # The classifier decides whether the cross-platform matrix runs, so a pull request must not be
      # able to edit its own classifier and suppress the native install checks (CWE-807). The code
      # that decides therefore comes from the BASE revision, which the pull request cannot influence;
      # only the SHA range it is asked about comes from the event. Full history so the range resolves.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          KEIKO_CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          KEIKO_CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # The base revision may predate the classifier itself — it does on the pull request that
        # introduces it. Absent trusted code, the honest answer is the fail-open one: classify
        # nothing and run the full matrix. Self-healing, since every later base has the script.
        run: |
          set -euo pipefail
          if [ -f scripts/check-documentation-only-change.mjs ]; then
            node scripts/check-documentation-only-change.mjs
          else
            echo "documentation-only-change: false — the base revision has no classifier yet"
            echo "documentation-only=false" >> "${GITHUB_OUTPUT}"
          fi

  core-quality:
    name: Core quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - run: npm ci --ignore-scripts
      - name: Install sandbox isolation backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bubblewrap (and the
          # unshare fallback) need them to create the network namespace. Relax it for the runner so
          # the enforced-egress proof below actually exercises the isolation boundary (ADR-0043).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Enforced sandbox egress proof (ADR-0043 / #1202)
        # NOT gated by the feat/keiko-editor branch skip: the assured pre-filter executes untrusted
        # model-generated code, so the deny-by-default egress boundary must be proven on every run.
        # The egress test fails the job if an outbound connection from inside network:"none" succeeds.
        run: npm --workspace @oscharko-dev/keiko-sandbox test
      - name: Verify Keiko Editor package
        run: |
          npm --workspace @oscharko-dev/keiko-editor run build
          npm --workspace @oscharko-dev/keiko-editor run typecheck
          npm --workspace @oscharko-dev/keiko-editor test
      - run: npm run typecheck
      - run: npm run check:version-consistency
      - run: npm run check:dependency-hygiene
      # Makes each OSV waiver's "not shipped" claim executable: an ID-wide suppression must never
      # hide the same advisory once it reaches a dependency Keiko distributes.
      - run: npm run check:osv-waiver-scope
      - run: npm run check:knip
      - run: npm run check:qodo-config
      - run: npm run check:release-required-workflows
      - run: npm run check:portable-approvals
      - run: npm run check:git-client-evidence
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run format:check
      - name: UI i18n guard
        env:
          KEIKO_I18N_GUARD_BASE_REF: ${{ github.base_ref }}
          KEIKO_I18N_GUARD_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "${KEIKO_I18N_GUARD_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=100 origin "${KEIKO_I18N_GUARD_BASE_REF}:refs/remotes/origin/${KEIKO_I18N_GUARD_BASE_REF}"
          elif [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${GITHUB_REF_NAME:-}" != "dev" ]; then
            git fetch --no-tags --depth=100 origin "dev:refs/remotes/origin/dev"
          fi
          npm run check:ui-i18n
      - run: npm run check:adr-index
      - run: npm run arch:check
      - run: npm run arch:check:negative
      - name: Quality Intelligence supply-chain gate
        run: npm run check:qi-supply-chain
      - name: Retrieval latency gate (enterprise retrieval M3)
        # Runs after `npm run typecheck` (which builds packages), so the compiled keiko-workspace
        # dist the gate imports is present. Deterministic fixture + generous p95 ceiling.
        run: npm run check:retrieval-latency
      - name: Retrieval quality gate (enterprise retrieval M4)
        # Same compiled workspace surface as the latency gate; evaluates top-k quality, line-level
        # evidence, and generated-artifact leakage over fixed synthetic enterprise fixtures.
        run: npm run check:retrieval-quality
      - name: Grounded retrieval quality gate (RB-5, GEN-AI-RELEASE-GATE-001)
        # Drives the REAL production semantic-retrieval + RRF fusion + model-reranker path (not the
        # lexical toy corpus) over distractor-dense fixtures with non-tautological (<1) floors, and
        # PROVES the gate is non-vacuous by asserting an injected ranking/reranker regression drops
        # below the floors. Uses the compiled keiko-server dist built by `npm run typecheck` above.
        run: npm run check:grounded-retrieval-quality
      - name: Grounded faithfulness gate (RB-4, GEN-AI-EVAL-003)
        # Scores the real citation-reconciliation + abstention logic over scripted answerer variants
        # (faithful / hallucinated-citation / confident-over-empty / refusal). Fails closed if a
        # fabricated citation stops being flagged or empty evidence stops abstaining.
        run: npm run check:grounded-faithfulness
      - name: Grounded entailment gate (Knowledge M1.2, Issue #2563)
        # Scores the real claim-segmentation + entailment-reconciliation + marker logic over
        # distractor-dense fixtures with a deterministic scripted judge (same port as the gateway
        # judge). Fails closed if an in-pack-but-unsupported claim stops being flagged, a supported
        # claim is falsely flagged, an unavailable judge stops degrading to WARN, or a pass-through
        # judge still "detects" (the checker must be load-bearing — non-tautology proven in CI).
        run: npm run check:grounded-entailment
      - name: Provision the sqlite-vec loadable extension (Issue #2566)
        # The ANN proof in the closeout gate below drives the real extension. It is not an npm
        # dependency — sqlite-vec publishes an invalid SPDX license string that both the
        # dependency-review policy and check:workspace-supply-chain reject — so it is fetched here
        # and verified against a pinned SHA-256, the same way the Sonar Scanner CLI is obtained.
        run: npm run provision:sqlite-vec
      - name: Knowledge M2 closeout gate (Knowledge M2.8, Epic #2556)
        # The wave's anti-false-green artifact. Re-runs the six substrate proofs (ANN activation,
        # one reranker transport importer, the evaluation fold, the retrieval-context wire snapshot,
        # the repository pod, and the wave bookkeeping state read out of docs/qa/knowledge-m2-wave.md)
        # and compares the committed docs/qa/knowledge-m2-substrate-evidence.md against a freshly
        # rendered one, failing closed on drift. Uses the compiled dist built by `npm run typecheck`.
        run: npm run check:knowledge-m2-closeout
      - name: Server error observability gate (RB-6, GEN-OBS-DIAGNOSTICS-901)
        # Drives the REAL built BFF: forces a handler throw and asserts the top-level catch returns an
        # opaque 500 that carries a correlation id (body + X-Keiko-Correlation-Id header), routes the
        # redacted cause to the operator diagnostic sink keyed by that id, never leaks the raw cause,
        # and honours a UI-supplied id. Goes RED against a bare `.catch(() => {})` that drops the id or
        # the diagnostic. Uses the compiled keiko-server dist built by `npm run typecheck` above.
        run: npm run check:error-observability
      - name: Context quality gate (ADR-0052, context-engineering PR1)
        # Runs after `npm run typecheck` (which builds packages), so the compiled keiko-contracts,
        # keiko-workflows, keiko-workspace, and keiko-security dist the gate imports are present —
        # the same build dependency the retrieval gates above rely on. Drives the deterministic lane
        # allocator over a fixed offline corpus and enforces context-quality invariants.
        run: npm run check:context-quality
      - name: Keiko Editor static-export bundle gate
        run: |
          npm run build:ui
          npm run check:editor-bundle-size -- --require-static-export
          npm run check:editor-release-evidence
      - name: Package surface and installable smoke
        run: |
          npm run build
          npm run prepare:bin
          npm run prune:package-build-artifacts
          npm run prune:package-native-optionals
          npm run check:package-surface
          KEIKO_SMOKE_PACK_IGNORE_SCRIPTS=1 npm run smoke:install

  # Issue #2704: the three coverage suites used to run serially inside `coverage-sonar`, and that one
  # step was the whole clean-pull-request critical path (1649 s of a 1936 s job on run 30156130977:
  # packages 1093 s, keiko-ui 383 s, scripts 161 s). They now execute as parallel jobs, with the
  # heaviest suite split into vitest shards. Every one of them MEASURES and none of them judges
  # (ADR-0156 D1): a shard writes a vitest blob report, and `coverage-sonar` below merges the blobs
  # and evaluates every floor exactly once, against complete coverage. A per-shard verdict would
  # compare a third of the suite against the whole suite's floors.
  coverage-packages:
    name: Coverage shard (packages ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One shard's result must never mask another's; `coverage-sonar` fails closed on all of them.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Unchanged from the serial job: package tests read real repository history.
          fetch-depth: 0
          persist-credentials: false
          # Pinned to the run's immutable commit, not the moving ref the single job could safely
          # use: five checkouts now feed one merged verdict, and `refs/pull/N/merge` is rewritten
          # whenever the head or base moves. Skew would have the shards measure one tree while the
          # gates and the scanner judge another, with nothing to detect it (Issue #2704).
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Restore the npm download cache
        # Restore-only. The measuring jobs sit on the critical path, and on a cold key all five
        # would otherwise tar and compress a several-hundred-megabyte `~/.npm` in their post-job
        # step for exactly one of them to win the reservation. `coverage-sonar` runs last and owns
        # the save.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The npm DOWNLOAD cache only. `node_modules` is never cached or restored anywhere in this
          # workflow: `npm ci --ignore-scripts` always executes, and its per-package lockfile
          # integrity verification is the post-restore integrity check for this cache. A restored
          # tarball whose digest does not match the lockfile fails the install (Issue #2704).
          # Exact key only: a prefix match would restore an older cache and save it back merged, and
          # npm never prunes `_cacache`, so the entry would grow until it evicted itself out of the
          # repository cache budget. A miss simply reproduces today's cold install.
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-node24.18.0-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Install sandbox isolation backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Coverage executes the same live isolation proofs as the core test job. Ubuntu 24.04
          # otherwise exposes bubblewrap while AppArmor prevents it from creating the namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Restore the provisioned sqlite-vec extension
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `provision:sqlite-vec` recomputes the extension's SHA-256 and compares it against the
          # pinned value on every run, restored or not, and refuses a file that does not match — so
          # this cache can only ever save the download, never substitute the artifact.
          path: .sqlite-vec
          key: sqlite-vec-${{ runner.os }}-${{ hashFiles('scripts/provision-sqlite-vec.mjs') }}
      - name: Provision the sqlite-vec loadable extension (Issue #2566)
        # Not an npm dependency: sqlite-vec publishes an invalid SPDX license string, which both the
        # dependency-review policy and check:workspace-supply-chain reject — the latter by design has
        # no exception mechanism. Fetched here and verified against a pinned SHA-256 instead, the
        # same way the Sonar Scanner CLI is obtained in the finalizing job. Without the binary the
        # vector-index suite asserts its fail-closed fallback rather than skipping, so this step adds
        # real-binary coverage. It does gate: a failed download or a checksum mismatch exits nonzero
        # and fails the job, which is the intended behaviour — a tampered artifact must stop the run,
        # not silently downgrade it to fallback coverage. Hosts with no published asset return
        # success. Provisioned in every coverage job so each suite executes in exactly the
        # environment it did when the three ran in one job.
        run: npm run provision:sqlite-vec
      - name: Measure package coverage shard
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        # `--reporter` on the command line REPLACES the reporter list, and vitest only auto-appends
        # `default` + `github-actions` when that list is empty. The npm script carries `default` so a
        # local shard run still prints its failures; the annotation reporter is added here, where
        # `GITHUB_ACTIONS` is what makes it meaningful, so a failing shard still annotates the diff
        # instead of showing nothing but a nonzero exit code.
        run: npm run test:coverage:packages:shard -- --shard=${{ matrix.shard }}/3 --reporter=github-actions
      - name: Upload package coverage shard evidence
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-blob-packages-${{ matrix.shard }}
          # Vitest names a sharded blob `blob-<index>-<count>.json`, so the three uploads merge into
          # one directory without collision. `.vitest-reports` is a dot directory and
          # upload-artifact skips those unless told otherwise.
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-ui:
    name: Coverage suite (keiko-ui)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Pinned to the run's immutable commit, not the moving ref the single job could safely
          # use: five checkouts now feed one merged verdict, and `refs/pull/N/merge` is rewritten
          # whenever the head or base moves. Skew would have the shards measure one tree while the
          # gates and the scanner judge another, with nothing to detect it (Issue #2704).
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Restore the npm download cache
        # Restore-only; `coverage-sonar` owns the save. See the note in `coverage-packages`.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-node24.18.0-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Install sandbox isolation backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Restore the provisioned sqlite-vec extension
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sqlite-vec
          key: sqlite-vec-${{ runner.os }}-${{ hashFiles('scripts/provision-sqlite-vec.mjs') }}
      - name: Provision the sqlite-vec loadable extension (Issue #2566)
        run: npm run provision:sqlite-vec
      # Not optional and easy to lose in the split: while the three suites shared one step, the
      # package build came free with `test:coverage:packages`, which runs first in that chain. The
      # UI imports workspace packages by bare specifier and they resolve to `dist`, which no
      # checkout contains, so a standalone job has to build them itself — as the `ui` job below
      # already does for the same reason.
      - name: Build internal packages so workspace dist resolves
        run: npm run build:packages
      # This suite declares no coverage thresholds, so it needs no measure/judge split: it produces
      # its final LCOV and summary directly and the finalizing job only relocates them.
      - name: Measure keiko-ui coverage
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run test:coverage:ui
      - name: Upload keiko-ui coverage evidence
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-ui
          # Exactly the two artefacts the downstream gates read (the ratchet's summary and the LCOV
          # the mapping gate and the scanner consume). The HTML tree the lcov reporter also writes is
          # ~1 GB of derived output no gate looks at.
          path: |
            packages/keiko-ui/coverage/lcov.info
            packages/keiko-ui/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

  coverage-scripts:
    name: Coverage suite (scripts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Pinned to the run's immutable commit, not the moving ref the single job could safely
          # use: five checkouts now feed one merged verdict, and `refs/pull/N/merge` is rewritten
          # whenever the head or base moves. Skew would have the shards measure one tree while the
          # gates and the scanner judge another, with nothing to detect it (Issue #2704).
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Restore the npm download cache
        # Restore-only; `coverage-sonar` owns the save. See the note in `coverage-packages`.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-node24.18.0-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Install sandbox isolation backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Restore the provisioned sqlite-vec extension
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sqlite-vec
          key: sqlite-vec-${{ runner.os }}-${{ hashFiles('scripts/provision-sqlite-vec.mjs') }}
      - name: Provision the sqlite-vec loadable extension (Issue #2566)
        run: npm run provision:sqlite-vec
      # Same reason as in `coverage-ui`: several `scripts/__tests__` suites import workspace
      # packages by bare specifier, which resolve to `dist`.
      - name: Build internal packages so workspace dist resolves
        run: npm run build:packages
      - name: Measure script coverage
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run test:coverage:scripts
      - name: Upload script coverage evidence
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-scripts
          path: |
            coverage/scripts/lcov.info
            coverage/scripts/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

  coverage-sonar:
    name: Coverage and SonarCloud
    # `always()` is load-bearing. Without it a failing shard would leave this job SKIPPED, and a
    # skipped context reads like "not applicable" rather than "a coverage suite did not execute".
    # The first step below turns every non-success shard result — failure, cancelled AND skipped —
    # into a red context. ADR-0135 D3 is unaffected: this job is not itself a required check; it is
    # the dependency the required `ci` aggregate already observes (Issue #2704).
    if: ${{ always() }}
    needs:
      - coverage-packages
      - coverage-scripts
      - coverage-ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every coverage suite to have executed
        env:
          PACKAGES_RESULT: ${{ needs.coverage-packages.result }}
          SCRIPTS_RESULT: ${{ needs.coverage-scripts.result }}
          UI_RESULT: ${{ needs.coverage-ui.result }}
        run: |
          set -euo pipefail
          unexecuted=0
          for entry in "packages:${PACKAGES_RESULT}" "keiko-ui:${UI_RESULT}" "scripts:${SCRIPTS_RESULT}"; do
            if [ "${entry#*:}" != "success" ]; then
              echo "Coverage suite '${entry%%:*}' did not succeed: ${entry#*:}"
              unexecuted=1
            fi
          done
          if [ "$unexecuted" -ne 0 ]; then
            echo "A coverage suite must EXECUTE for this context to be green: failure, cancelled and"
            echo "skipped are all non-success and fail closed here. A silently skipped shard must"
            echo "never let this context pass with a coverage suite unexecuted."
            exit 1
          fi
          echo "Every coverage suite succeeded."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Pinned to the run's immutable commit, not the moving ref the single job could safely
          # use: five checkouts now feed one merged verdict, and `refs/pull/N/merge` is rewritten
          # whenever the head or base moves. Skew would have the shards measure one tree while the
          # gates and the scanner judge another, with nothing to detect it (Issue #2704).
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Restore and maintain the npm download cache
        # The one job that also SAVES. It runs after the measuring jobs, so a cold key costs exactly
        # one post-job compression instead of six racing ones.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-node24.18.0-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      # Reassembly happens before ANY evaluation, and the `needs:` edges above make that ordering
      # structural rather than a convention: a per-file floor read off one shard's partial summary
      # would silently under-report, so no gate below ever sees a shard-local view.
      - name: Download package coverage shard evidence
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # The blob reporter's own default directory, so `test:coverage:packages:shard` followed
          # by `test:coverage:packages:merge` composes locally too, with no artifact relocation.
          path: .vitest-reports
          pattern: coverage-blob-packages-*
          merge-multiple: true
      - name: Download keiko-ui coverage evidence
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report-ui
          path: packages/keiko-ui/coverage
      - name: Download script coverage evidence
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report-scripts
          path: coverage/scripts
      - name: Verify every package coverage shard delivered its evidence
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        # download-artifact's `pattern:` form succeeds silently when nothing matches, so it is the
        # one fail-open primitive in this chain. Counting the blobs binds the hardcoded `/3` in the
        # shard command to the matrix: if the two ever drift, a PARTIAL merge would otherwise be
        # judged as if it were complete.
        run: |
          set -euo pipefail
          expected=3
          actual=$(find .vitest-reports -maxdepth 1 -name 'blob-*.json' -type f | wc -l | tr -d ' ')
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected package coverage shard blobs, found $actual."
            echo "A merge over a partial shard set would under-report every per-file floor."
            exit 1
          fi
          echo "All $expected package coverage shard blobs are present."
      - name: Reassemble merged package coverage
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        # Vitest's own blob merge, not a bespoke reassembler: it merges the shards' coverage maps
        # and re-runs the reporters, so `coverage/packages/lcov.info` and `coverage-summary.json`
        # are regenerated rather than concatenated. The summary carries only covered/total counts
        # with no line identity and is not losslessly concatenable. This run uses the JUDGING
        # configuration, so the per-file floors are evaluated here, once, on complete coverage.
        run: npm run test:coverage:packages:merge
      - name: Coverage quality gates
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run check:coverage:quality
      - name: Verify governed Sonar analysis scope
        run: npm run check:sonar-scope
      - name: Verify changed production sources are mapped into LCOV
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-lcov-source-mapping.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Resolve project version for SonarCloud
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
        id: sonar-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify manual analysis is bound to remote dev
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: sonar-head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="$(git rev-parse refs/remotes/origin/dev)"
          if [ "$actual" != "$expected" ]; then
            echo "Manual Sonar analysis checkout is not the fetched remote dev revision."
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned Sonar Scanner CLI archive
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keyed on the archive's own pinned digest, so a new scanner version or a corrected
          # checksum is a different cache entry rather than a stale hit. The digest is re-verified
          # after restore by the step below — the cache is a download saver, not a trust anchor.
          # Cached where the scanner already lived: under RUNNER_TEMP, outside the repository.
          path: ${{ runner.temp }}/sonar-scanner-cli.zip
          key: sonar-scanner-cli-8.1.0.6389-linux-x64-bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b
      - name: Download Sonar Scanner CLI
        # Downloaded and checksum-verified directly rather than through a marketplace action whose
        # license is denied by the repository dependency-review policy.
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
        run: |
          set -euo pipefail
          scanner_zip="$RUNNER_TEMP/sonar-scanner-cli.zip"
          if [ ! -f "$scanner_zip" ]; then
            curl --proto '=https' -sSfL -o "$scanner_zip" "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip"
          fi
          # Re-executed after every cache restore, and fail-closed by design: a restored archive
          # whose digest does not match the pinned value is a tampered artifact, not a stale one.
          # The remediation is to evict the cache entry, never to skip the verification.
          echo "bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b  $scanner_zip" | sha256sum --check
          unzip -q "$scanner_zip" -d "$RUNNER_TEMP"
          echo "SONAR_SCANNER_HOME=$RUNNER_TEMP/sonar-scanner-8.1.0.6389-linux-x64" >> "$GITHUB_ENV"
      - name: SonarCloud CI-based analysis (ADR-0131 / ADR-0134)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
        id: sonar-scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          STEPS_SONAR_VERSION_OUTPUTS_VERSION: ${{ steps.sonar-version.outputs.version }}
          # Pull-request runs analyze the GitHub-provided merge ref (refs/pull/N/merge), whose commit
          # SHA differs from the pull-request head. Pin the analysis revision to the head commit so the
          # SonarCloud SCM sensor attributes changed lines to the real head instead of warning "detected
          # as changed but without having changed lines". Push/dispatch runs analyze their own head.
          SONAR_HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.sonar-head.outputs.sha || github.sha }}
        run: |
          # ADR-0139 D6: transient SonarCloud-side provisioning or network failures retry with
          # backoff before failing closed; genuine quality-gate failures are never retried.
          for attempt in 1 2 3; do
            set +e
            "$SONAR_SCANNER_HOME/bin/sonar-scanner" \
              -Dsonar.projectBaseDir="$GITHUB_WORKSPACE" \
              -Dsonar.projectVersion="${STEPS_SONAR_VERSION_OUTPUTS_VERSION}" \
              -Dsonar.scm.revision="${SONAR_HEAD_SHA}" \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.working.directory="$RUNNER_TEMP/sonar-work" \
              2>&1 | tee "$RUNNER_TEMP/sonar-scanner.log"
            scanner_status=${PIPESTATUS[0]}
            set -e
            if [ "$scanner_status" -eq 0 ]; then
              break
            fi
            if ! grep -qE "Gateway Timeout|Bad Gateway|Service Unavailable|Failed to query JRE metadata|connect timed out|Connection reset" "$RUNNER_TEMP/sonar-scanner.log"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient SonarCloud failure (attempt $attempt); retrying after backoff."
              sleep $((attempt * 30))
            fi
          done
          node scripts/check-sonar-analysis-log.mjs --log "$RUNNER_TEMP/sonar-scanner.log"
          echo "status=$scanner_status" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            exit 0
          fi
          exit "$scanner_status"
      - name: Verify SonarCloud Banking Grade PR evidence
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
        env:
          SONAR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SONAR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/check-sonar-pr-quality-gate.mjs
      - name: Verify SonarCloud Banking Grade dev evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          SONAR_HEAD_SHA: ${{ steps.sonar-head.outputs.sha }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/check-sonar-main-quality-gate.mjs

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - change-scope
      - protected-branch-gate
      - core-quality
      - coverage-sonar
      - cross-platform-smoke
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate required CI results fail closed
        env:
          CORE_QUALITY_RESULT: ${{ needs.core-quality.result }}
          COVERAGE_SONAR_RESULT: ${{ needs.coverage-sonar.result }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform-smoke.result }}
          DOCUMENTATION_ONLY: ${{ needs.change-scope.outputs.documentation-only }}
          PROTECTED_BRANCH_RESULT: ${{ needs.protected-branch-gate.result }}
        run: |
          for result in "$PROTECTED_BRANCH_RESULT" "$CORE_QUALITY_RESULT" "$COVERAGE_SONAR_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Required CI dependency did not succeed: $result"
              exit 1
            fi
          done
          # The cross-platform matrix is the only dependency allowed to be skipped, and only when the
          # change-scope job classified this change set as documentation-only. Any other skip — a
          # cancellation, a dependency failure, a mistaken condition — still fails closed.
          if [ "$CROSS_PLATFORM_RESULT" = "skipped" ]; then
            if [ "$DOCUMENTATION_ONLY" != "true" ]; then
              echo "Cross-platform smoke was skipped without a documentation-only change set."
              exit 1
            fi
            echo "Cross-platform smoke skipped: documentation-only change set."
          elif [ "$CROSS_PLATFORM_RESULT" != "success" ]; then
            echo "Required CI dependency did not succeed: $CROSS_PLATFORM_RESULT"
            exit 1
          fi
          echo "All required CI dependencies succeeded."

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download and verify actionlint
        run: |
          curl --proto '=https' -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

  verify-pinned-shas:
    name: Verify pinned action SHAs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Assert all action references are pinned to 40-hex SHAs
        run: |
          set -euo pipefail
          violations=$(grep -rnE '^\s*-?\s*uses:' .github/workflows/ \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*docker://' \
            | grep -vE 'uses:\s*[A-Za-z0-9._/-]+@[0-9a-f]{40}([[:space:]]|$|#)' || true)
          if [ -n "$violations" ]; then
            echo "Unpinned action references (must pin to a full 40-hex commit SHA):"
            echo "$violations"
            exit 1
          fi
          echo "All action references are pinned to full commit SHAs."

  zizmor:
    name: zizmor
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          version: "1.26.1"
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true

  build-scan-sbom-smoke:
    name: Build, scan, SBOM, smoke
    # Keep early feature-branch PRs fast. These release/package gates still run on merges to
    # feat/keiko-editor, on dev/release PRs, and on manual workflow_dispatch runs.
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Prepare packaged CLI and UI assets
        run: |
          npm run prepare:bin
          npm run build:ui
          npm run check:editor-release-evidence
      - name: Installable-package smoke (Issue #169 AC2)
        run: npm run smoke:install
      - name: Installable-package smoke with optional dependencies
        run: npm run smoke:install:optional
      - name: Installable memory smoke (Issue #216)
        run: npm run smoke:install:memory
      - name: Smoke - offline evaluate exits 0
        run: KEIKO_EVIDENCE_DIR="$(mktemp -d)" node dist/cli/index.js evaluate --suite all
      - name: Security audit (high and above)
        # Scoped to the SHIPPED dependency graph, matching the CycloneDX SBOM step below (which has
        # always used `--omit dev`): this job audits what Keiko distributes. Build-time-only
        # advisories are surfaced by the OSV lane instead, where they can be triaged individually
        # with a recorded reason and expiry (osv-scanner.toml) rather than blocking every pull
        # request on a transitive lint dependency that never reaches a user.
        run: npm audit --audit-level=high --omit=dev
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - name: Workspace SBOM and license gate (Issue #169 AC4)
        run: npm run check:workspace-supply-chain
      - name: Smoke - help exits 0
        run: node dist/cli/index.js --help
      - name: Smoke - version exits 0
        run: node dist/cli/index.js --version
      - name: Smoke - unknown command exits 2
        run: |
          set +e
          node dist/cli/index.js definitely-not-a-command
          code=$?
          if [ "$code" -ne 2 ]; then echo "expected exit 2, got $code"; exit 1; fi
          echo "unknown-command exit code correct: $code"
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
      # Build-provenance (not SBOM-predicate) attestation: this job has no single packed artifact
      # to bind an SBOM-attestation subject to (no `npm pack` runs here), so this proves the SBOM
      # document itself was produced by this exact workflow run/commit, not tampered or fabricated.
      # Scoped to `push` only (dev/release branches) so PR and workflow_dispatch runs stay
      # unverified-staging and do not add attestation noise for commits that never ship.
      - name: Attest build provenance for root SBOM
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: sbom.cdx.json
      - name: Upload workspace SBOMs (Issue #169 AC4)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-sboms-cyclonedx
          path: sbom/
          retention-days: 90
      - name: Attest build provenance for workspace SBOMs
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: sbom/workspace-*.cdx.json

  cross-platform-smoke:
    name: Cross-platform smoke (${{ matrix.os }})
    # Roughly half of a run's weighted runner minutes (macOS bills 10x, Windows 2x). A change that
    # touches no code, manifest, lockfile, workflow or test cannot alter how the product builds and
    # installs on another operating system.
    needs: change-scope
    # `always()` is load-bearing: without it a change-scope job that fails for its own reasons —
    # checkout, runner, a broken script — skips this matrix, and the `ci` aggregate then rejects a
    # skip no documentation-only verdict authorized. The classifier is fail-open by construction, so
    # its own failure must mean "run everything", never "run nothing and block the merge".
    if: ${{ always() && needs.change-scope.outputs.documentation-only != 'true' }}
    # The Node.js 24 baseline must execute, typecheck, build, and install on every supported desktop
    # OS. The complete hermetic suite remains in the Linux `ci` job because many security fixtures
    # intentionally model POSIX paths, Bash, and symlinks. Keep fail-fast:false so one platform
    # result never masks another.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: runner.os == 'Windows'
        with:
          dotnet-version: "8.0.x"
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - run: npm ci --ignore-scripts
      - name: Configure MSVC for native quality analysis
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ tools were not found" }
          $vcvars = Join-Path $installation "VC/Auxiliary/Build/vcvars64.bat"
          $vcvarsWrapper = Join-Path $env:RUNNER_TEMP "keiko-vcvars-env.cmd"
          Set-Content -LiteralPath $vcvarsWrapper -Encoding ascii -Value "@call `"$vcvars`" >nul`r`n@set"
          $environment = & cmd.exe /d /c $vcvarsWrapper
          if ($LASTEXITCODE -ne 0) { throw "MSVC environment initialization failed" }
          foreach ($name in @("PATH", "INCLUDE", "LIB", "LIBPATH")) {
            $line = $environment | Where-Object { $_ -match "^$name=" } | Select-Object -First 1
            if (-not $line) { throw "MSVC environment did not define $name" }
            $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Verify productive native sources on macOS
        if: runner.os == 'macOS'
        run: npm run check:native:macos
      - name: Verify productive native sources on Windows
        if: runner.os == 'Windows'
        run: npm run check:native:windows
      - name: Install Linux sandbox isolation backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Typecheck the complete package graph
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Two separate steps (not one multi-line run): on the Windows runner the default shell is
      # PowerShell, which only surfaces the exit code of the LAST line of a multi-line `run`; as
      # discrete steps each command's failure fails the job on every OS.
      - name: Prepare packaged CLI
        run: npm run prepare:bin
      - name: Build UI (static export)
        run: npm run build:ui
      - name: Installable-package smoke (Issue #169 AC2 / #284 AC4 cross-platform)
        env:
          # Pack the dist already built by the steps above instead of re-running the Linux-oriented
          # `prepack` publish gate (arch-check / package-surface / supply-chain shell out to npx/npm
          # in ways that are not Windows-portable — a separate concern from artifact portability).
          # The gating `build-scan-sbom-smoke` job keeps the full prepack pack on Linux.
          KEIKO_SMOKE_PACK_IGNORE_SCRIPTS: "1"
        run: npm run smoke:install
      - name: Installable-package smoke with native optional dependencies
        env:
          KEIKO_SMOKE_PACK_IGNORE_SCRIPTS: "1"
        run: npm run smoke:install:optional

  ui:
    name: ui
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The immutable D12 evidence gate recomputes the subject for its pinned baseline commit.
          # Keep that commit reachable instead of relying on the default single-commit checkout.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install workspaces (single root lockfile after #167)
        run: npm ci --ignore-scripts
      - name: Install sandbox isolation backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The #2215 real-BFF E2E executes verification commands through the same mandatory
          # network:none boundary as production. Ubuntu 24.04 restricts unprivileged user
          # namespaces via AppArmor, so enable the proven Bubblewrap path exactly as the required
          # ci job does; never weaken the verification runner to inherited networking for tests.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build internal packages so contracts dist resolves for UI tsc
        run: npm run build:packages
      - name: Security audit UI dependencies (moderate and above)
        # Same shipped-graph scope as the audit in the build job; the UI's dev toolchain (eslint,
        # next lint plugins) is not part of the static export this job builds.
        run: npm audit --audit-level=moderate --omit=dev --workspace @oscharko-dev/keiko-ui
      - name: Lint UI
        run: npm run lint --workspace @oscharko-dev/keiko-ui
      - name: Typecheck UI
        run: npm run typecheck --workspace @oscharko-dev/keiko-ui
      - name: Verify UI source compatibility with TypeScript 7
        run: npm run typecheck:native --workspace @oscharko-dev/keiko-ui
      - name: Build UI (static export)
        run: npm run build --workspace @oscharko-dev/keiko-ui
      - name: Generate UI CycloneDX SBOM
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm sbom --sbom-format cyclonedx --omit dev --workspace @oscharko-dev/keiko-ui > ui-sbom.cdx.json
      - name: Test UI with coverage (jsdom + axe a11y)
        run: npm run test:coverage:ui
      - name: UI coverage ratchet
        run: npm run check:coverage:ui
      - name: Install Playwright browser
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        # chromium is the reference browser for the smoke + perf-evidence suites. The
        # workspace-performance webkit project is a local-only cross-browser aid: headless WebKit on CI
        # software-renders and mis-batches events, so both its timing and write-coalescing budgets are
        # environment artifacts (all CI perf-evidence runs are scoped to --project=chromium).
        run: npx --ignore-scripts playwright@1.61.1 install --with-deps chromium
      - name: Release smoke E2E
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run test:e2e:smoke
      - name: Editor run, verify, problems E2E (#2215)
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run test:e2e:editor-run-verification-2215
      - name: Governed editor debugging E2E (#2348)
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run test:e2e:editor-debugging-2348
      - name: M11 mixed-trust multi-root closeout E2E (#2533)
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run test:e2e:editor-m11-closeout-2533
      - name: Refresh workspace performance evidence
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          rm -f docs/release/1580-workspace-perf-evidence.json
          npm run test:e2e:workspace-perf
      # The editor document is the immutable D12 baseline/candidate comparison measured on the PR
      # candidate. Its source-tree and toolchain bindings (ADR-0139 D2: measured surfaces only)
      # make it valid across the signed squash and across merge-queue integration.
      - name: Validate immutable editor D12 performance evidence
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        # The base ref scopes the measurement-toolchain freshness check to diffs that actually move
        # the ruler. Integrity, budgets and the pinned-baseline anchor are checked unconditionally;
        # only the "was this measured with the current toolchain" question is the responsibility of
        # the change that altered it, not of every other open pull request (ADR-0139 D10).
        env:
          # merge_group carries no pull_request payload; its base sha lives under merge_group.
          # Without this the merge queue would see an empty base ref, fall back to evaluating the
          # digest unconditionally, and reintroduce exactly the cross-PR blocking this removes.
          KEIKO_PERF_EVIDENCE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: npm run check:perf-evidence:editor
      - name: Performance evidence freshness + budget gate
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: npm run check:perf-evidence
      # Upload only metric documents that passed the redaction-closing schema and canonical-byte
      # gate above. Raw traces can contain workspace fixture text and remain outside this boundary.
      - name: Upload redacted performance evidence
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/release/1209-perf-evidence.json
            docs/release/1580-workspace-perf-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Build package and UI assets
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: |
          npm run build
          npm run prepare:bin
          npm run build:ui
          npm run check:editor-release-evidence
          npm run prune:package-build-artifacts
          npm run prune:package-native-optionals
      - name: Verify package surface
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: npm run check:package-surface
      - name: Smoke - keiko ui serves /api/health
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        run: |
          set -euo pipefail
          node dist/cli/index.js ui --port 4399 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          body=$(curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4399/api/health)
          echo "health: $body"
          echo "$body" | grep -q '"status":"ok"'
      - name: Upload UI SBOM
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/keiko-editor' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-sbom-cyclonedx
          path: ui-sbom.cdx.json
          retention-days: 90
      # Same build-provenance-of-the-document rationale as the root/workspace SBOM attestations in
      # the build-scan-sbom-smoke job: no single packed UI artifact exists to bind an SBOM-predicate
      # attestation subject to at this point, so this attests the SBOM document's own provenance.
      - name: Attest build provenance for UI SBOM
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ui-sbom.cdx.json
