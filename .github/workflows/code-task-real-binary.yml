name: Code task real binary

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  milestone-1-real-binary:
    name: Milestone 1 real OpenCode (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          cache: "npm"
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install workspaces
        run: npm ci --ignore-scripts
      - name: Build workspace packages
        # run-code-task-real-binary.mjs imports @oscharko-dev/keiko-model-gateway from
        # packages/*/dist, and --ignore-scripts builds nothing: every scheduled run since at least
        # 2026-09-09 failed with ERR_MODULE_NOT_FOUND before the journey started.
        run: npm run build:packages
      - name: Stage approved OpenCode dev-lane payload
        run: npm run dev:coding-runtime:stage
      - name: Install Playwright Chromium
        run: node node_modules/playwright/cli.js install chromium
      - name: Run the production-discovery Milestone-1 journey
        run: npm run test:e2e:code-task:real-binary
      - name: Upload content-free functional evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-task-real-binary-evidence
          path: test-results/code-task-real-binary-evidence.json
          if-no-files-found: error
          retention-days: 30
