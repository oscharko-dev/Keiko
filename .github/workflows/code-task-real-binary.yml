name: Code task real binary

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  milestone-1-real-binary:
    name: Milestone 1 real OpenCode (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install workspaces
        run: npm ci --ignore-scripts
      - name: Stage approved OpenCode dev-lane payload
        run: npm run dev:coding-runtime:stage
      - name: Install Playwright Chromium
        run: node node_modules/playwright/cli.js install chromium
      - name: Run the production-discovery Milestone-1 journey
        run: npm run test:e2e:code-task:real-binary
      - name: Upload content-free functional evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-task-real-binary-evidence
          path: |
            test-results/code-task-real-binary-evidence.json
            test-results/**/trace.zip
          if-no-files-found: error
          retention-days: 30
