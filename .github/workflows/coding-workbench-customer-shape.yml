name: Coding Workbench customer-shape qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/coding-workbench-customer-shape.yml"
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/keiko-activity-log/**"
      - "packages/keiko-contracts/**"
      - "packages/keiko-cli/**"
      - "packages/keiko-harness/**"
      - "packages/keiko-model-gateway/**"
      - "packages/keiko-sandbox/**"
      - "packages/keiko-server/**"
      - "packages/keiko-tools/**"
      - "packages/keiko-ui/**"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      published_install:
        description: "Also verify the published root package with npm, npx and Yarn on Windows x64 and Intel macOS"
        type: boolean
        default: false

permissions: {}

jobs:
  published-install:
    if: github.event_name == 'workflow_dispatch' && inputs.published_install
    name: Published package on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Verify native hardware and published artifact identity
        shell: pwsh
        run: |
          node scripts/check-runtime-toolchain.mjs --exact
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((node -p process.arch) -ne 'x64') { throw 'Expected an x64 Node runtime' }
          if ($IsMacOS) {
            if ((uname -m) -ne 'x86_64' -or (sysctl -n machdep.cpu.brand_string) -notmatch 'Intel') { throw 'Expected an Intel Mac' }
            sw_vers
            sysctl -n machdep.cpu.brand_string
          } else {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          }
          $spec = node -p "const p=require('./package.json'); p.name+'@'+p.version"
          npm view $spec name version dist.integrity gitHead --json --registry=https://registry.npmjs.org/
      - name: Build the workspace packages the registry smoke loads
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:packages
      - name: Install the published package into fresh npm and pinned Yarn projects
        shell: pwsh
        run: npm run smoke:registry-install -- --qualify-ui
      - name: Execute the pinned published CLI with npx
        shell: pwsh
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $spec = "$($manifest.name)@$($manifest.version)"
          $temp = Join-Path $env:RUNNER_TEMP ("keiko-published-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $temp | Out-Null
          Push-Location -LiteralPath $temp
          try {
            $env:npm_config_cache = Join-Path $temp 'cache'
            $env:npm_config_registry = 'https://registry.npmjs.org/'
            $out = npx --yes "--package=$spec" -- keiko --version
            if ($LASTEXITCODE -or ($out -join [char]10) -notmatch ("(?<![\d.])" + [regex]::Escape($manifest.version) + "(?![\d.])")) {
              throw 'Published npx CLI did not report the requested version'
            }
            Write-Output "Published npx CLI passed for $spec"
          } finally { Pop-Location }
  qualify:
    name: Qualify staged Coding Workbench on macOS 15
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify pull-request merge candidate consistency
        if: ${{ github.event_name == 'pull_request' }}
        env:
          KEIKO_CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KEIKO_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ci-merge-candidate.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspace packages for qualification
        run: npm run build:packages
      - name: Provision the pinned ripgrep runtime
        run: npm run provision:ripgrep
      - name: Inspect Darwin Git attestation prerequisites
        run: node scripts/testing/inspect-darwin-git-host.mjs
      - name: Install Chromium for customer-shape qualification
        timeout-minutes: 10
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run customer-shape qualification
        timeout-minutes: 25
        run: npm run qualify:coding-workbench:customer-shape
  repository-relay:
    # #4530: a Coding run on macOS builds and tests a Maven and an npm project whose dependencies
    # only a password-protected internal repository serves, in all three modes, through the real
    # Seatbelt boundary and the repository credential relay (ADR-0184). A wrong login never passes.
    # #4519: the whole acceptance task runs as a standard account the job creates.
    name: Coding acceptance with a password-protected repository on macOS 15
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspace packages
        run: npm run build:packages
      - name: Stage approved OpenCode dev-lane payload
        run: npm run dev:coding-runtime:stage
      - name: Provision the pinned ripgrep runtime
        run: npm run provision:ripgrep
      - name: Show the Maven and Java the builds use
        run: mvn -v
      - name: Provision the acceptance Maven cache
        run: npm run provision:acceptance-maven
      # #4519: the promise is for a person without administrator rights on a Mac without a container
      # runtime. The runner's account is an administrator, so it only sets up: it creates a standard
      # account and gives it its own copy of the checkout, Node.js and the JDK, held in its home folder
      # as such a person would hold them. The acceptance task then runs as that account, and the job
      # passes only when the task's evidence certifies the promise.
      - name: Create the standard account the acceptance task runs as
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          sudo sysadminctl -addUser keikoqa -fullName "Keiko acceptance" -shell /bin/zsh \
            -home /Users/keikoqa -password "${password}"
          sudo createhomedir -c -u keikoqa >/dev/null
          : "${JAVA_HOME:?the runner image names no JDK}"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          jdk_bundle="$(dirname "$(dirname "${JAVA_HOME}")")"
          sudo ditto "${GITHUB_WORKSPACE}" /Users/keikoqa/keiko
          sudo ditto "${node_root}" /Users/keikoqa/.local/node
          sudo ditto "${jdk_bundle}" /Users/keikoqa/Library/Java/JavaVirtualMachines/acceptance.jdk
          sudo chown -R keikoqa:staff /Users/keikoqa/keiko /Users/keikoqa/.local /Users/keikoqa/Library/Java
          echo "account: $(id keikoqa)"
          if dseditgroup -o checkmember -m keikoqa admin >/dev/null 2>&1; then
            echo "::error::the acceptance account is an administrator"
            exit 1
          fi
      - name: Run the coding acceptance task as the standard account
        run: |
          temp="$(sudo -u keikoqa getconf DARWIN_USER_TEMP_DIR)"
          sudo -u keikoqa -H /usr/bin/env -i \
            HOME=/Users/keikoqa USER=keikoqa LOGNAME=keikoqa SHELL=/bin/zsh LANG=en_US.UTF-8 CI=true \
            TMPDIR="${temp}" \
            PATH=/Users/keikoqa/.local/node/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            JAVA_HOME=/Users/keikoqa/Library/Java/JavaVirtualMachines/acceptance.jdk/Contents/Home \
            KEIKO_OPENCODE_DEV_LANE_FUNCTIONAL=1 KEIKO_OS_KEYCHAIN=off \
            KEIKO_ACCEPTANCE_EVIDENCE_FILE=/Users/keikoqa/acceptance-evidence/evidence.json \
            /bin/sh -s <<'ACCEPTANCE'
          cd "$HOME/keiko" || exit 1
          echo "groups: $(id -Gn)"
          npx vitest run packages/keiko-server/src/coding-runtime/productionOpenCodeBackend.acceptance.test.ts \
            --reporter=default --reporter=json --outputFile="$HOME/acceptance-report/acceptance.json"
          tests=$?
          node scripts/check-vitest-report-ran.mjs "$HOME/acceptance-report/acceptance.json"
          ran=$?
          node scripts/check-acceptance-evidence.mjs "$HOME/acceptance-evidence/evidence.json"
          certified=$?
          [ "$tests" -eq 0 ] && [ "$ran" -eq 0 ] && [ "$certified" -eq 0 ]
          ACCEPTANCE
      - name: Run the real Maven and npm clients through the relay
        env:
          KEIKO_REPOSITORY_RELAY_REAL_CLIENTS: "1"
          KEIKO_OS_KEYCHAIN: "off"
        run: |
          npx vitest run packages/keiko-server/src/coding-runtime/nativeRepositoryRelay.clients.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/relay-clients.json"
          node scripts/check-vitest-report-ran.mjs "$RUNNER_TEMP/relay-clients.json"
