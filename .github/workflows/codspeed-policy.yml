name: CodSpeed policy

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review, edited]

# GitHub loads this workflow and every executable file from the protected base. The candidate
# commit and tree are preflighted before bounded policy data is downloaded; PR code is never run.

concurrency:
  group: codspeed-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: CodSpeed policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize the immutable protected base
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_REPOSITORY: ${{ github.repository }}
        run: |
          case "$QUALITY_BASE_SHA" in
            "" | *[!0-9a-f]* )
              echo "Protected base is not an immutable SHA."
              exit 1
              ;;
          esac
          if [ "${#QUALITY_BASE_SHA}" -ne 40 ]; then
            echo "Protected base is not an immutable SHA."
            exit 1
          fi
          git init .
          git remote add origin "https://github.com/${QUALITY_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$QUALITY_BASE_SHA"
          if [ "$(git rev-parse FETCH_HEAD)" != "$QUALITY_BASE_SHA" ]; then
            echo "Fetched base does not match the immutable event SHA."
            exit 1
          fi
          git checkout --detach "$QUALITY_BASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Require the base-owned policy gate
        run: test -f scripts/check-codspeed-policy.mjs
      - name: Require the base-owned reviewer policy gate
        run: test -f scripts/check-reviewer-policy.mjs
      - name: Fetch the projected exact-head commit and complete tree
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_COMMIT_QUERY: query($owner:String!,$name:String!,$oid:GitObjectID!){repository(owner:$owner,name:$name){object(oid:$oid){... on Commit {oid tree {oid}}}}}
          QUALITY_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          QUALITY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.name }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_REPOSITORY: ${{ github.repository }}
          QUALITY_REVIEWER_COMMIT_PATH: ${{ runner.temp }}/reviewer-commit.json
          QUALITY_REVIEWER_TREE_PATH: ${{ runner.temp }}/reviewer-tree.json
        run: |
          case "$QUALITY_HEAD_SHA" in
            "" | *[!0-9a-f]* )
              echo "Candidate head is not an immutable SHA."
              exit 1
              ;;
          esac
          if [ "${#QUALITY_HEAD_SHA}" -ne 40 ]; then
            echo "Candidate head is not an immutable SHA."
            exit 1
          fi
          umask 077
          gh api graphql \
            -f query="$QUALITY_COMMIT_QUERY" \
            -f owner="$QUALITY_HEAD_OWNER" \
            -f name="$QUALITY_HEAD_REPOSITORY" \
            -f oid="$QUALITY_HEAD_SHA" \
            --jq '{sha: .data.repository.object.oid, tree: {sha: .data.repository.object.tree.oid}}' \
            > "$QUALITY_REVIEWER_COMMIT_PATH"
          QUALITY_TREE_SHA="$(jq -er '.tree.sha | strings' "$QUALITY_REVIEWER_COMMIT_PATH")"
          case "$QUALITY_TREE_SHA" in
            "" | *[!0-9a-f]* )
              echo "Candidate tree is not an immutable SHA."
              exit 1
              ;;
          esac
          if [ "${#QUALITY_TREE_SHA}" -ne 40 ]; then
            echo "Candidate tree is not an immutable SHA."
            exit 1
          fi
          gh api \
            "repos/${QUALITY_REPOSITORY}/git/trees/${QUALITY_TREE_SHA}?recursive=1" \
            > "$QUALITY_REVIEWER_TREE_PATH"
      - name: Preflight exact-head reviewer inputs and execution anchors
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_REVIEWER_COMMIT_PATH: ${{ runner.temp }}/reviewer-commit.json
          QUALITY_REVIEWER_TREE_PATH: ${{ runner.temp }}/reviewer-tree.json
        run: node scripts/check-reviewer-policy.mjs --preflight
      - name: Fetch preflighted exact-head policies as untrusted data
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_CODERABBIT_PATH: ${{ runner.temp }}/coderabbit.yaml
          QUALITY_CODSPEED_POLICY_PATH: ${{ runner.temp }}/codspeed-policy.json
          QUALITY_GREPTILE_CONFIG_PATH: ${{ runner.temp }}/greptile-config.json
          QUALITY_GREPTILE_FILES_PATH: ${{ runner.temp }}/greptile-files.json
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_REPOSITORY: ${{ github.repository }}
        run: |
          umask 077
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${QUALITY_REPOSITORY}/contents/.codspeed-policy.json?ref=${QUALITY_HEAD_SHA}" \
            > "$QUALITY_CODSPEED_POLICY_PATH"
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${QUALITY_REPOSITORY}/contents/.coderabbit.yaml?ref=${QUALITY_HEAD_SHA}" \
            > "$QUALITY_CODERABBIT_PATH"
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${QUALITY_REPOSITORY}/contents/.greptile/config.json?ref=${QUALITY_HEAD_SHA}" \
            > "$QUALITY_GREPTILE_CONFIG_PATH"
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${QUALITY_REPOSITORY}/contents/.greptile/files.json?ref=${QUALITY_HEAD_SHA}" \
            > "$QUALITY_GREPTILE_FILES_PATH"
      - name: Verify reviewer controls against protected-base policy
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_CODERABBIT_PATH: ${{ runner.temp }}/coderabbit.yaml
          QUALITY_GREPTILE_CONFIG_PATH: ${{ runner.temp }}/greptile-config.json
          QUALITY_GREPTILE_FILES_PATH: ${{ runner.temp }}/greptile-files.json
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_REVIEWER_COMMIT_PATH: ${{ runner.temp }}/reviewer-commit.json
          QUALITY_REVIEWER_TREE_PATH: ${{ runner.temp }}/reviewer-tree.json
        run: node scripts/check-reviewer-policy.mjs
      - name: Verify live settings against the candidate policy
        env:
          QUALITY_CODSPEED_POLICY_PATH: ${{ runner.temp }}/codspeed-policy.json
        run: node scripts/check-codspeed-policy.mjs
