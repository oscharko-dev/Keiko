name: CodSpeed policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# GitHub loads this workflow and every executable file from the protected base. The candidate
# policy is downloaded as bounded JSON data for the exact head; pull-request code is never run.

concurrency:
  group: codspeed-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: CodSpeed policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Require the base-owned policy gate
        run: test -f scripts/check-codspeed-policy.mjs
      - name: Fetch the exact-head policy as untrusted data
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_CODSPEED_POLICY_PATH: ${{ runner.temp }}/codspeed-policy.json
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_REPOSITORY: ${{ github.repository }}
        run: |
          case "$QUALITY_HEAD_SHA" in
            "" | *[!0-9a-f]* )
              echo "Candidate head is not an immutable SHA."
              exit 1
              ;;
          esac
          if [ "${#QUALITY_HEAD_SHA}" -ne 40 ]; then
            echo "Candidate head is not an immutable SHA."
            exit 1
          fi
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${QUALITY_REPOSITORY}/contents/.codspeed-policy.json?ref=${QUALITY_HEAD_SHA}" \
            > "$QUALITY_CODSPEED_POLICY_PATH"
      - name: Verify live settings against the candidate policy
        env:
          QUALITY_CODSPEED_POLICY_PATH: ${{ runner.temp }}/codspeed-policy.json
        run: node scripts/check-codspeed-policy.mjs
