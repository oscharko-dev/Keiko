name: Dependency Review

on:
  pull_request:
    branches:
      - dev
      - feat/keiko-editor
      - feat/keiko-agent-native-editor-foundation-and-runtime
      - "release/**"
  # ADR-0139 D7: the merge queue re-triggers this workflow so the required check reports on the
  # merge group; the diff itself was already reviewed on the pull request head, so the job is
  # skipped there (a skipped required job satisfies branch protection).
  merge_group:
    branches:
      - dev

permissions: {}

jobs:
  dependency-review:
    name: Review dependency diff (dev/main)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: development, runtime, unknown
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, CC-BY-4.0,
            CC0-1.0, ISC, MIT, Python-2.0, Unlicense, WTFPL
          # The licence allowlist stays permissive-only: every copyleft licence is refused by
          # default, and `allow-licenses` is NOT scope-aware, so admitting LGPL there would admit it
          # for runtime dependencies too. The exception is therefore taken per PACKAGE, which is what
          # the decision actually was (owner, 2026-07-25, Issue #2699; ADR-0002).
          #
          # `eslint-plugin-sonarjs` is LGPL-3.0-only and makes SonarCloud's rule engine runnable on a
          # developer machine — without it every rule violation arrived as a red required check, so
          # the gate discovered requirements instead of confirming them (ADR-0156). LGPL copyleft
          # attaches to the library and to works that link it; a linter executed in CI and locally is
          # neither linked into Keiko nor distributed with it. Any other LGPL package still fails,
          # and this one would have to be re-decided if it ever became a runtime dependency.
          allow-dependencies-licenses: pkg:npm/eslint-plugin-sonarjs
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5
          show-patched-versions: true
