name: Dependency Review

on:
  pull_request:
    branches:
      - dev
      - feat/keiko-editor
      - feat/keiko-agent-native-editor-foundation-and-runtime
      - "release/**"
  # ADR-0139 D7: the merge queue re-triggers this workflow so the required check reports on the
  # merge group; the diff itself was already reviewed on the pull request head, so the job is
  # skipped there (a skipped required job satisfies branch protection).
  merge_group:
    branches:
      - dev

permissions: {}

jobs:
  dependency-review:
    name: Review dependency diff (dev/main)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: development, runtime, unknown
          # LGPL-3.0-only is admitted for BUILD-TIME TOOLING ONLY, decided by the owner on
          # 2026-07-25 for `eslint-plugin-sonarjs` (Issue #2699). Its copyleft attaches to the
          # library and to works that link it; a linter that runs in CI and on developer machines is
          # neither linked into Keiko nor distributed with it, so no obligation reaches our source or
          # our artifacts. `fail-on-scopes` deliberately keeps `runtime` in scope, so an LGPL package
          # that ever became a runtime dependency would still have to be decided again, on its own
          # merits — this entry is not a general licence widening.
          #
          # Why it was worth deciding: SonarCloud's rule engine was invisible on a developer machine,
          # so every rule violation arrived as a red required check. `npm run check:sonar-rules` makes
          # the gate confirm a known answer instead of discovering it (ADR-0156).
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, CC-BY-4.0,
            CC0-1.0, ISC, LGPL-3.0-only, MIT, Python-2.0, Unlicense, WTFPL
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5
          show-patched-versions: true
