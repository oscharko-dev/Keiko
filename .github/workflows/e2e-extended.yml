# GEN-TEST-E2E-005 / GEN-TEST-RELEASE-GATE-004 — the editor, git-window, and Local-Knowledge browser
# e2e suites exist and pass locally but were wired into NO workflow, so their selectors, routes, and
# real-Monaco/real-BFF journeys could silently rot between releases (the only per-PR browser proof is
# the @smoke journey). This scheduled workflow runs the orphaned suites nightly and on demand. It is
# intentionally NOT a required check (a nightly red is a signal to fix, not a merge blocker); the
# fail-fast:false matrix keeps every suite's result independent.
name: E2E Extended

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      code_task_real_binary:
        description: Run only the #2483 real OpenCode macOS proof
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extended-e2e:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.code_task_real_binary }}
    name: extended e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # #2485: the Local Knowledge campaign's large-PDF passes bind a curated multi-hundred-page
      # document that only exists on the maintainer corpus machine; the hermetic generated corpus
      # covers the bounded large-document path via the 1024-byte threshold policy instead. Only
      # the local-knowledge suite reads this variable.
      KEIKO_LK_INCLUDE_LARGE_PDF: "0"
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test:e2e:editor-baseline-1377
          - test:e2e:editor-layout-1375
          - test:e2e:editor-chat-2119
          # Restored #1395 invariant as a targeted pin against today's surface (ADR-0058,
          # ADR-0066): sensitive-path denial, the authority-missing fail-closed default, and the
          # redacted audit feed. Wired from day one on purpose. The #1394 undo/redo round-trip
          # joins this suite once #3070 lands the product fix.
          - test:e2e:editor-agent-pins
          # Issues #2852/#2867: these release-evidence journeys had silently rotted while present
          # only as npm scripts. Keep their current Workbench and editor contracts exercised.
          - test:e2e:coding-workbench-2253
          - test:e2e:formatting-1380
          - test:e2e:language-intelligence-1383
          - test:e2e:git-changes-1575
          # Issue #2887: keep the governed Git delivery/PR/merge journeys and the Files-window
          # repository transition coverage on the nightly lane. Their dedicated configs boot the
          # packaged UI with the required delivery feature flag and cannot run under the shared
          # per-PR smoke server without changing the product surface under test.
          - test:e2e:git-status-1386
          - test:e2e:git-branch-sync-1576
          - test:e2e:git-client-closeout-1578
          - test:e2e:git-delivery-475
          - test:e2e:git-pr-merge-1577
          - test:e2e:git-publish-476
          - test:e2e:merge-governance-478
          - test:e2e:pr-command-center-477
          - test:e2e:local-knowledge
          # Epic #2285 (Editor M11). Only the #2533 closeout journey runs per pull request; these
          # seven per-child journeys shipped with npm scripts and no lane at all, which is the exact
          # silent-rot this workflow exists to prevent. All seven pass locally against the real BFF.
          - test:e2e:workspace-trust-2523
          - test:e2e:multi-root-editor-2525
          - test:e2e:multi-root-search-2526
          - test:e2e:per-root-settings-2527
          - test:e2e:editor-profiles-2528
          - test:e2e:profile-portability-2529
          - test:e2e:file-history-2531
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: "npm"
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install workspaces
        run: npm ci --ignore-scripts
      # KEIKO-0610 / #2485: suites executing verification commands go through the real
      # verification runner, which always enforces the mandatory network:none boundary
      # (enforce-or-fail-closed) — without the isolation backend every verification
      # fails closed on this runner and the suite cannot pass. Ubuntu 24.04 restricts
      # unprivileged user namespaces via AppArmor, so enable the proven Bubblewrap path
      # exactly as the required ci job and the code-task lane below do; never weaken
      # the verification runner to inherited networking for tests.
      - name: Setup Linux sandbox isolation
        uses: ./.github/actions/setup-sandbox-isolation
      - name: Build internal packages
        run: npm run build:packages
      - name: Build UI static export
        run: npm run build:ui
      - name: Install Playwright browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run test:e2e:code-task:opencode-tracer
        run: npm run test:e2e:code-task:opencode-tracer
      - name: Run test:e2e:code-task:authority
        if: ${{ !cancelled() }}
        run: npm run test:e2e:code-task:authority
      - name: Run test:e2e:code-task-research-2387
        if: ${{ !cancelled() }}
        run: npm run test:e2e:code-task-research-2387
      # #2485: same failure-diagnosability aid as the extended matrix above.
      - name: Upload failure artifacts (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-task-e2e-failure
          path: test-results/
          retention-days: 14

  code-task-real-binary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.code_task_real_binary }}
    uses: ./.github/workflows/code-task-real-binary.yml
