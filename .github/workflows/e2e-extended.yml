# GEN-TEST-E2E-005 / GEN-TEST-RELEASE-GATE-004 — the editor, git-window, and Local-Knowledge browser
# e2e suites exist and pass locally but were wired into NO workflow, so their selectors, routes, and
# real-Monaco/real-BFF journeys could silently rot between releases (the only per-PR browser proof is
# the @smoke journey). This scheduled workflow runs the orphaned suites nightly and on demand. It is
# intentionally NOT a required check (a nightly red is a signal to fix, not a merge blocker); the
# fail-fast:false matrix keeps every suite's result independent.
name: E2E Extended

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  extended-e2e:
    name: extended e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    env:
      # #2485: the Local Knowledge campaign's large-PDF passes bind a curated multi-hundred-page
      # document that only exists on the maintainer corpus machine; the hermetic generated corpus
      # covers the bounded large-document path via the 1024-byte threshold policy instead. Only
      # the local-knowledge suite reads this variable.
      KEIKO_LK_INCLUDE_LARGE_PDF: "0"
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test:e2e:editor-baseline-1377
          - test:e2e:editor-layout-1375
          - test:e2e:editor-run-verification-2215
          - test:e2e:git-changes-1575
          - test:e2e:local-knowledge
          # Epic #2285 (Editor M11). Only the #2533 closeout journey runs per pull request; these
          # seven per-child journeys shipped with npm scripts and no lane at all, which is the exact
          # silent-rot this workflow exists to prevent. All seven pass locally against the real BFF.
          - test:e2e:workspace-trust-2523
          - test:e2e:multi-root-editor-2525
          - test:e2e:multi-root-search-2526
          - test:e2e:per-root-settings-2527
          - test:e2e:editor-profiles-2528
          - test:e2e:profile-portability-2529
          - test:e2e:file-history-2531
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install workspaces
        run: npm ci --ignore-scripts
      - name: Install sandbox isolation backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # #2485: test:e2e:editor-run-verification-2215 executes verification commands through
          # the real verification runner, which always enforces the mandatory network:none
          # boundary (enforce-or-fail-closed) — without the isolation backend every verification
          # fails closed on this runner and the suite can never pass. Ubuntu 24.04 restricts
          # unprivileged user namespaces via AppArmor, so enable the proven Bubblewrap path
          # exactly as the required ci job and the code-task lane below do; never weaken the
          # verification runner to inherited networking for tests.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build internal packages
        run: npm run build:packages
      - name: Install Playwright browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run ${{ matrix.suite }}
        run: npm run ${{ matrix.suite }}
      # #2485: without retained traces/screenshots a nightly red is undiagnosable from logs alone
      # (git-changes-1575 stayed unexplained for 13 nights). Retention is short: these are debug
      # aids, not evidence artifacts.
      - name: Derive artifact-safe suite name
        if: failure()
        env:
          SUITE: ${{ matrix.suite }}
        run: echo "SUITE_SLUG=${SUITE//:/-}" >> "$GITHUB_ENV"
      - name: Upload failure artifacts (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-e2e-failure-${{ env.SUITE_SLUG }}
          path: test-results/
          retention-days: 14

  # Issue #2474 — the Code-task journeys (#2385 tracer, #2386 authority) boot dedicated TEST-ONLY
  # server entries through owned Playwright configs and are excluded from the generic collection,
  # so no other lane exercises them. One sequential job instead of two matrix entries: each journey
  # boot re-runs build:packages/build:ui, so pre-building once here keeps both boots incremental
  # against the same artifacts instead of paying the full rebuild twice. The `!cancelled()` guard
  # keeps the second journey's result independent of the first (same intent as fail-fast: false
  # above); a red journey turns this lane red.
  code-task-e2e:
    name: code-task e2e (scripted engine)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install workspaces
        run: npm ci --ignore-scripts
      - name: Install sandbox isolation backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Both journeys execute the vetted verification step through the real verification
          # runner, which always enforces the mandatory network:none boundary
          # (enforce-or-fail-closed). Ubuntu 24.04 restricts unprivileged user namespaces via
          # AppArmor, so enable the proven Bubblewrap path exactly as the required ci job does;
          # never weaken the verification runner to inherited networking for tests.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build internal packages
        run: npm run build:packages
      - name: Build UI static export
        run: npm run build:ui
      - name: Install Playwright browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run test:e2e:code-task:opencode-tracer
        run: npm run test:e2e:code-task:opencode-tracer
      - name: Run test:e2e:code-task:authority
        if: ${{ !cancelled() }}
        run: npm run test:e2e:code-task:authority
      # #2485: same failure-diagnosability aid as the extended matrix above.
      - name: Upload failure artifacts (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-task-e2e-failure
          path: test-results/
          retention-days: 14
