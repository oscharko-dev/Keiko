name: Greptile settlement

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# GitHub loads pull_request_target only from the default branch. The migration PR that introduces
# this file cannot run it; the first eligible event is a later PR, when both workflow and script
# already exist on the immutable base. Never replace this activation boundary with head execution.

concurrency:
  group: greptile-settlement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  settlement:
    name: Greptile findings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # pull_request_target is deliberate: materialize only the immutable base and execute its gate.
      # Never check out, import, or execute pull-request code in this privileged workflow.
      - name: Materialize the immutable protected base
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_REPOSITORY: ${{ github.repository }}
        run: |
          case "$QUALITY_BASE_SHA" in
            "" | *[!0-9a-f]* )
              echo "Protected base is not an immutable SHA."
              exit 1
              ;;
          esac
          if [ "${#QUALITY_BASE_SHA}" -ne 40 ]; then
            echo "Protected base is not an immutable SHA."
            exit 1
          fi
          git init .
          git remote add origin "https://github.com/${QUALITY_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$QUALITY_BASE_SHA"
          if [ "$(git rev-parse FETCH_HEAD)" != "$QUALITY_BASE_SHA" ]; then
            echo "Fetched base does not match the immutable event SHA."
            exit 1
          fi
          git checkout --detach "$QUALITY_BASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Require the base-owned settlement gate
        run: test -f scripts/check-greptile-findings.mjs
      - name: Require exact-head Greptile settlement
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node scripts/check-greptile-findings.mjs
