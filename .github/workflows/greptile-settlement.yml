name: Greptile settlement

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: greptile-settlement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  settlement:
    name: Greptile findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request_target is deliberate: checkout only the immutable base and execute its gate.
      # Never check out, import, or execute pull-request code in this privileged workflow.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Require exact-head Greptile settlement
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node scripts/check-greptile-findings.mjs
