# Keiko for Quality — GitHub Action execution shell (proof of concept, issue #2506).
#
# Prototype that reuses the pure evaluator (scripts/keiko-for-quality-core.mjs) and the shared
# GitHub helpers from the Cloudflare Worker shell to reproduce the KFQ verdict without any external
# infrastructure. It coexists with the live Worker under a distinct check name and dashboard marker
# and only evaluates pulls that carry the opt-in label (see the env below), so the real gate is
# untouched while the two run side by side.
#
# Tamper-resistance: the `check_run` and `issue_comment` triggers run the workflow definition from
# the repository's default branch (`dev`), not from pull-request code, so a pull cannot alter the
# evaluator that judges it. The `pull_request` trigger runs the pull's own copy for fast first
# feedback; the base-branch triggers are the authority. See
# docs/qa/keiko-for-quality-action-evaluation.md.
name: Keiko for Quality (Action)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - dev
  check_run:
    types: [completed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to evaluate"
        required: true
        type: string

permissions: {}

# One in-flight evaluation per pull request. Runs are not cancelled mid-flight so a publish always
# completes; the next event re-evaluates the exact current head from scratch.
concurrency:
  group: >-
    kfq-action-${{ github.event.pull_request.number || github.event.issue.number ||
    github.event.inputs.pr || github.event.check_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate quality aggregate
    # Skip comment events on plain issues (only pull-request comments carry review evidence).
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Evaluate Keiko for Quality
        env:
          # App auth (preferred) keeps the check bound to the Keiko for Quality App id, preserving the
          # exact branch-protection pin. Absent the App secrets the shell falls back to GITHUB_TOKEN
          # and the check is produced under the GitHub Actions App id (documented in the evaluation).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KFQ_APP_ID: ${{ secrets.KFQ_APP_ID }}
          KFQ_PRIVATE_KEY_PKCS8: ${{ secrets.KFQ_PRIVATE_KEY_PKCS8 }}
          KFQ_PR: ${{ github.event.inputs.pr }}
          # Non-secret configuration, mirroring the live Worker variables.
          TARGET_REPOSITORIES_JSON: >-
            [{"repository":"oscharko-dev/Keiko","baseBranch":"dev","profile":"keiko"},
            {"repository":"oscharko-dev/Keiko-Native","baseBranch":"dev","profile":"keiko-native"}]
          STABILITY_WINDOW_MS: "60000"
          SOCKET_RISK_ALLOWLIST_JSON: "[]"
          SOCKET_RISK_ACTORS_JSON: "[]"
          KFQ_ACTION_LABEL: kfq-action-poc
        run: node scripts/keiko-for-quality-action.mjs
