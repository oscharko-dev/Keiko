name: keiko-for-quality

# ADR-0170. Model-backed review by the external Keiko for Quality bot, published as native
# review conversations. This workflow adds no required status context: blocking comes solely from
# GitHub's existing Required Conversation Resolution rule acting on what the reviewer publishes.
#
# `pull-requests: write` is enough to submit an APPROVE review, so the platform does not withhold
# approval — only the pinned action's behaviour does, and that is pinned by a test upstream
# (ADR-0170 D3). Treat the capability as present when assessing a compromised action.
#
# `pull_request_target` is deliberate and is what makes this safe rather than what makes it risky:
# GitHub takes the workflow definition from the protected base, so a candidate cannot alter what
# runs. The candidate is never checked out — see the two checkout steps below.
on:
  pull_request_target:
    # `converted_to_draft` and `closed` produce no review of their own — the job condition rejects
    # both. They are listed so the trigger fires at all: that starts a replacement run whose
    # concurrency group cancels the review already in flight. Without them, a pull request pulled
    # back to draft or closed outright keeps a credential-bearing review running, still holding the
    # environment secrets, still spending model budget, and still able to publish findings onto a
    # draft or an abandoned pull request until it finishes or hits the job timeout.
    types:
      [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed, edited]

# Empty at workflow level on purpose: the two jobs below need disjoint authority, and either
# job holding the other's grant is exactly the coupling this file exists to avoid. Each job
# declares precisely its own — see the notes on both.
permissions: {}

concurrency:
  # Metadata-only edits get their own group. `cancel-in-progress: false` protects only the RUNNING
  # member of a group — GitHub still evicts a *pending* run when a newer one enters it. Without the
  # split, a title edit arriving while a synchronize run is still queued would replace that queued
  # review with a run whose job then skips, leaving the current head unreviewed.
  group: >-
    keiko-for-quality-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'edited' && github.event.changes.base == null) && 'meta' || 'review'
    }}
  # Cancel a superseded review — but NOT for a metadata-only `edited` event. Concurrency is
  # evaluated when the workflow is triggered, not when the job decides to run, so an unconditional
  # `true` lets a title or description edit cancel an in-flight review and leave the current head
  # unreviewed until the arming interlock expires.
  cancel-in-progress: >-
    ${{ github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This condition is the security-relevant eligibility layer: a job that never starts never has
    # the environment's secrets materialized. Its evidence is the skipped job in the Actions run,
    # not a redacted diagnostic — no process runs to emit one. The action re-checks eligibility for
    # every head that does reach it, which is what decides the base-retarget `edited` case and what
    # protects the boundary if this condition is ever relaxed.
    #
    # The enable switch keeps the reviewer inert until an operator has provisioned the model
    # secrets, the credential, and the App installation. It is a separate non-sensitive variable
    # rather than the endpoint itself, because a job condition cannot read a secret. Without it,
    # merging this workflow would
    # make every `dev` pull request carry a failing job that no contributor can fix. An inert
    # reviewer is visibly absent rather than noisily broken — and this reviewer publishes no
    # required status context, so its absence blocks nothing either way (ADR-0170 D6).
    #
    # `state == 'open'` is what makes the `closed` trigger a pure cancellation: the event fires, the
    # concurrency group evicts the running review, and this job then declines to start a new one.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'dev' &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      vars.KEIKO_QUALITY_ENABLED == 'true'
    # What the review needs and nothing more. No write scope beyond the review conversations
    # themselves: no contents-write, checks-write, actions-write, commit, push, or merge
    # authority. Approval is deliberately IN the threat model: `pull-requests: write` can submit
    # an APPROVE review, and only the pinned action's behaviour declines to (ADR-0170 D3).
    #
    # There is deliberately NO `actions: write` anywhere in this workflow. The store persists as
    # a run ARTIFACT: uploading one needs no extra scope at all, and locating/downloading the
    # previous push's store needs only `actions: read` — which cannot cancel, re-run, or DISPATCH
    # anything. Dispatch was the sharp edge: its API takes a caller-chosen ref, so any write-
    # scoped token here could have started a dispatchable workflow from a candidate branch, whose
    # workflow file the candidate controls (raised by the Codex reviewer on #2931, in three
    # escalating rounds — the durable answer was removing the scope, not fencing it).
    # Independent containments stay: the keiko-for-quality environment carries a
    # protected-branches-only deployment policy, and release.yml's publish job sits behind the
    # npm-publish environment's required human reviewer.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    environment: keiko-for-quality
    steps:
      # Check out the TRUSTED BASE. Never `github.event.pull_request.head.sha`: under
      # pull_request_target that would place candidate-controlled files on disk in a job that holds
      # a credential.
      - name: Check out protected base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Fetch the candidate as Git objects only. Its content becomes readable through plumbing
      # without ever being written to the working tree.
      - name: Fetch candidate head as Git objects
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # --quiet: this step runs before the reviewer, and its output is ordinary Actions output
        # rather than redacted diagnostics. Keeping it minimal narrows what the job log carries.
        run: git fetch --quiet --no-tags --no-recurse-submodules origin "pull/${PR_NUMBER}/head"

      # The directory the store lives in. NOT dot-prefixed: actions/upload-artifact excludes
      # hidden paths unless told otherwise, and a hidden directory here would upload nothing and
      # fail the hand-off (`if-no-files-found: error`) on every complete review. Workspace-
      # relative on purpose: the action reads `review_store_path` with plain Node file I/O, which
      # does not expand `~`.
      - name: Ensure review-store directory exists
        run: mkdir -p keiko-review-store

      # Finds the newest store artifact an EARLIER RUN OF THIS WORKFLOW uploaded FOR THIS PULL
      # REQUEST. Three producer checks, because the artifact name alone proves nothing (names are
      # repository-wide and attacker-choosable): the producing run's event must be
      # `pull_request_target` — a candidate workflow file can never generate that event, since
      # the trigger always executes the protected base's file; its workflow path must be this
      # workflow — so a future second pull_request_target workflow cannot cross-feed stores; and
      # it must belong to this pull request — matched against the run's `pull_requests` list,
      # falling back to its head branch (the API omits the list on some runs), so another PR's
      # store can never replay per-file decisions against unrelated content. The name additionally
      # partitions by profile hash and model id, so a configuration change starts from an empty
      # store even before these checks run. Beneath all of that, the action re-derives every
      # entry's digests on load and rejects mismatches: a replayed entry is exactly as untrusted
      # as the run that produced it (pinned upstream). No match — first push, expired retention,
      # nothing complete yet, or a config change — means an empty store and a normal full review;
      # memoization is an optimization, never a dependency.
      - name: Locate previous review store
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: >-
            keiko-review-store-pr${{ github.event.pull_request.number }}-${{
              hashFiles('.github/keiko-for-quality.json') }}-${{ vars.KEIKO_QUALITY_MODEL_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          WORKFLOW_PATH: .github/workflows/keiko-for-quality.yml
        run: |
          MATCH="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[].workflow_run.id' \
            | while read -r RUN_ID; do
                OK="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '
                  select(.event == "pull_request_target")
                  | select(.path == env.WORKFLOW_PATH)
                  | select((([.pull_requests[]?.number] | index(env.PR_NUMBER | tonumber)) != null)
                           or ((.pull_requests | length) == 0
                               and .head_branch == env.HEAD_REF
                               and .head_repository.full_name == env.HEAD_REPO))
                  | "ok"' 2>/dev/null)"
                if [ "${OK}" = "ok" ]; then echo "${RUN_ID}"; break; fi
              done)"
          echo "run-id=${MATCH}" >> "${GITHUB_OUTPUT}"

      - name: Restore review store
        if: steps.locate.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            keiko-review-store-pr${{ github.event.pull_request.number }}-${{
              hashFiles('.github/keiko-for-quality.json') }}-${{ vars.KEIKO_QUALITY_MODEL_ID }}
          path: keiko-review-store
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Review
        id: review
        uses: oscharko-dev/Keiko-for-Quality@3e458cdc86eb102b3a06a7dfb161d3c0f12e8364 # v0.9.0
        env:
          # Passed by variable NAME to the action, never as an input value: an input appears in the
          # step context that every other action in the job can read.
          KEIKO_QUALITY_MODEL_TOKEN: ${{ secrets.KEIKO_QUALITY_MODEL_TOKEN }}
        with:
          profile: .github/keiko-for-quality.json
          # Secret, not a variable: repository variables are not masked, and an endpoint can be a
          # private provider address. A secret passed as an input is masked in logs.
          model_endpoint: ${{ secrets.KEIKO_QUALITY_MODEL_ENDPOINT }}
          model_id: ${{ vars.KEIKO_QUALITY_MODEL_ID }}
          model_protocol: ${{ vars.KEIKO_QUALITY_MODEL_PROTOCOL }}
          model_token_env: KEIKO_QUALITY_MODEL_TOKEN
          # A dedicated App identity is what makes marker-based deduplication sound: a marker is a
          # public string, so suppressing on one authored by anyone else would let a contributor
          # silence a finding by posting its fingerprint first.
          app_id: ${{ secrets.KEIKO_QUALITY_APP_ID }}
          app_private_key: ${{ secrets.KEIKO_QUALITY_APP_PRIVATE_KEY }}
          target_branches: dev
          # Ceiling, not the spend. Since v0.8.0 the action allots
          # min(ceiling, clamp(1.3 x (files x 40k + lines x 60), 80k, 6M)) per run and passes it to
          # the engine's own --max-tokens-budget, which stops dispatching new files at the limit
          # instead of reviewing everything first and confessing afterwards. The previous implicit
          # 2M default starved an 87-file pull request in production (#2926); the formula narrows
          # small runs far below this ceiling on its own, so raising it does not raise small-PR cost.
          token_budget: "6000000"
          # Enables per-file memoization (v0.9.0). Relative to the workspace; the file lives in
          # the directory the locate/upload steps carry between runs. Without this input the
          # store layer is fully inert — that property is pinned by a test upstream.
          review_store_path: keiko-review-store/store.json

      # Persists the store for the next push — as an artifact, which needs no write scope at all
      # (`actions: write` is deliberately absent from this workflow; see the permissions note).
      # Only a complete settlement produces an updated store upstream, and a Review step that
      # threw leaves `outcome` unset, so the condition skips both cases. The name partitions by
      # pull request, profile hash, and model id — the invalidation boundary the retired cache
      # key carried: after a profile or model change the locate step finds nothing and the next
      # review runs full-price rather than replaying decisions produced under the old
      # configuration (the action-version dimension lives in the store's own schema and key
      # derivation, which reject foreign entries regardless of what the name says). Runs each own
      # their artifact; the locate step picks the newest eligible one. Seven days comfortably
      # outlives any push gap on an active pull request.
      - name: Persist review store
        if: steps.review.outputs.outcome == 'complete'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            keiko-review-store-pr${{ github.event.pull_request.number }}-${{
              hashFiles('.github/keiko-for-quality.json') }}-${{ vars.KEIKO_QUALITY_MODEL_ID }}
          path: keiko-review-store
          retention-days: 7
          if-no-files-found: error
