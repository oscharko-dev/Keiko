name: Mutation security

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  mutation-quality-gate:
    name: Mutation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: "npm"
          node-version: "24.18.0"
      - name: Verify governed Node.js/npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - run: npm ci --ignore-scripts
      - name: Determine whether critical production logic changed
        if: ${{ github.event_name == 'pull_request' }}
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-mutation-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Run security mutation suite
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.required == 'true' }}
        env:
          MUTATION_FILES: ${{ steps.scope.outputs.files }}
        run: |
          if [ -n "${MUTATION_FILES:-}" ]; then
            npm run test:mutation:security:run -- --mutate "$MUTATION_FILES"
            npm run check:mutation:scoped
          else
            npm run test:mutation:security
          fi
      - name: Confirm mutation testing is not applicable
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.required != 'true' }}
        run: echo "No security-critical production files changed; mutation gate is not applicable."
