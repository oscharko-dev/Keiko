name: Mutation security

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-security-full
  cancel-in-progress: false

permissions: {}

jobs:
  mutation-quality-gate:
    name: Full mutation regression
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          node-version: "24.18.0"
      - name: Verify governed Node.js/npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - name: Run security mutation suite
        run: npm run test:mutation:security
