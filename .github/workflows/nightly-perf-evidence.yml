# ADR-0156 D6: scheduled automation owns DETECTION of editor performance evidence drift, not its
# repair. It cannot own repair: the D12 wall-clock budgets are absolute numbers calibrated on the
# declared reference environment (linux/arm64, >=14 logical cores — see docs/qa/perf-evidence.md),
# and every one of the eighteen committed evidence documents was measured there. A hosted runner is
# x86_64 with 4 cores, so the same work costs roughly twice as much and the budget can never be met.
# This lane used to run the full producer there anyway; it failed 12 of 12 times, published nothing,
# and left every toolchain-touching pull request stranded on evidence nothing could refresh.
#
# What is environment-independent is the drift question itself — source-tree, lockfile and
# measurement-toolchain digests are hashes. So this lane answers exactly that, in ~2 minutes instead
# of 180, and says out loud when the reference environment owes a re-measurement.
name: Nightly performance evidence

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-perf-evidence
  cancel-in-progress: false

jobs:
  detect-drift:
    name: Detect D12 evidence drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Scheduled runs always inspect dev; a manual dispatch inspects the dispatched ref so a
          # branch can ask the same question before it pays for a local re-measurement.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
      - run: npm ci --ignore-scripts
      # The full source-freshness contract: recorded digests against the current tree, plus every
      # budget re-derived from the committed samples. All deterministic, all hashes and arithmetic —
      # nothing here measures, so the runner's hardware cannot change the answer.
      - name: Check committed evidence against the current tree
        id: drift
        continue-on-error: true
        run: npm run check:perf-evidence:editor -- --enforce-source-freshness
      # A repair lane that fails silently is worse than no lane: twelve consecutive failures went
      # unnoticed between 2026-07-19 and 2026-07-25, until pull requests deadlocked on evidence
      # nothing was refreshing. `!cancelled()` rather than `failure()` so a timeout reports too.
      - name: Report drift that only the reference environment can repair
        if: ${{ !cancelled() && steps.drift.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="D12 evidence has drifted from ${GITHUB_REF_NAME}"
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title ${title}" --json number --jq '.[0].number // empty')
          # The format string is literal by design: values arrive as printf arguments.
          # shellcheck disable=SC2016
          body=$(printf 'The committed editor performance evidence no longer binds `%s`.\n\nRun: %s\n\nOnly the declared reference environment can produce comparable numbers (linux/arm64, >=14 logical cores). Regenerate there and commit both documents as the final commit of the pull request that moved the ruler:\n\n```bash\nnpm run perf:evidence:regen\n```\n\nSee `docs/qa/perf-evidence.md`. Until then, pull requests that do NOT touch a `D12_MEASUREMENT_TOOLCHAIN_PATHS` member are unaffected (ADR-0156 D2); one that does has no route to green.' "${GITHUB_REF_NAME}" "${RUN_URL}")
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi
      - name: Fail the lane when drift is unrepaired
        if: ${{ steps.drift.outcome == 'failure' }}
        run: |
          echo "Committed D12 evidence does not bind ${GITHUB_REF_NAME}; a tracking issue was filed."
          exit 1
