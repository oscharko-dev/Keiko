# ADR-0137 D3: scheduled automation owns editor performance evidence drift. This workflow
# re-runs the official D12 producer against the pinned baseline on a clean Linux environment,
# enforces the wall-clock budgets (controlled measurement context), and — when the refreshed
# documents differ from the committed ones — opens a bot pull request through the normal
# required-check path. Commits are created through the GitHub API so they are signed; no gate
# is bypassed and auto-merge follows ADR-0135.
name: Nightly performance evidence

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-perf-evidence
  cancel-in-progress: false

jobs:
  refresh-evidence:
    name: Refresh Linux D12 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
      - name: Install Bubblewrap for the DAP cap runs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: npm ci --ignore-scripts
      - name: Install Playwright browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Regenerate both editor evidence documents
        run: npm run perf:evidence:regen
      - name: Open a bot pull request when the evidence drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/release/1209-perf-evidence.json docs/release/1209-bundle-evidence.json; then
            echo "Committed evidence already matches the measured product; nothing to refresh."
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          branch="bot/nightly-perf-evidence-$(git rev-parse --short HEAD)-${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${branch}" -f sha="${head_sha}"
          for file in docs/release/1209-perf-evidence.json docs/release/1209-bundle-evidence.json; do
            if git diff --quiet -- "$file"; then continue; fi
            existing_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${branch}" --jq .sha)
            # API-created commits are signed by GitHub, satisfying the dev signed-commit rule.
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" \
              -f branch="${branch}" \
              -f message="docs(editor): refresh nightly Linux D12 evidence" \
              -f sha="${existing_sha}" \
              -f content="$(base64 -w0 "$file")"
          done
          gh pr create \
            --base dev \
            --head "${branch}" \
            --title "docs(editor): refresh nightly Linux D12 evidence" \
            --body "Scheduled ADR-0137 D3 refresh: the committed editor performance evidence drifted from the measured product on dev. Produced by the official Linux D12 producer (pinned baseline, wall-clock budgets enforced); integrates only through the normal required checks."
