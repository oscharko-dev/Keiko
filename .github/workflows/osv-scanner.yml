name: OSV dependency scan

on:
  # ADR-0156 D2: this scan is the compensating control for the shipped-dependency scope of the npm
  # audit gates, so it must cover every branch target those gates run on - not dev alone.
  #
  # ADR-0159: every event-driven execution of this scan moved into the single required
  # `workflow hygiene` context in .github/workflows/workflow-hygiene.yml, which declares the union of
  # this workflow's and ci.yml's surface - including `ready_for_review`, which ci.yml's default types
  # omit. Its `push` branch list is byte-identical to the one this file carried, so it strictly
  # dominates and running both would scan every pushed commit twice.
  #
  # What stays here is what an event-driven lane cannot do: `schedule` re-reads a LIVE vulnerability
  # database against an unchanged tree, so a newly published advisory is detected without anyone
  # pushing. That cadence is the reason this workflow still exists, and it is unchanged.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan dependency lockfiles
    runs-on: ubuntu-latest
    # ADR-0135 D4: a required workflow carries a repository-owned timeout appropriate to the
    # pull-request feedback loop. A healthy scan of this repository's lockfiles completes in under a
    # minute; 10 bounds a hung download or a stalled scanner without truncating a healthy run.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependency manifests with OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          # `--config` is passed explicitly rather than relying on directory auto-discovery, so the
          # committed triage record in osv-scanner.toml is the single, reviewable source of every
          # time-boxed waiver instead of something the scanner may or may not pick up per lockfile.
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./
