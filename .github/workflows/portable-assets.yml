name: Portable assets

# Builds and natively smokes the complete portable release on Linux, Windows, and both macOS
# architectures. Every stable artifact receives the mandatory Ed25519 release signature after
# GitHub assigns immutable release and asset IDs. Linux additionally carries an OIDC-attested
# runtime-qualification receipt. Apple Developer ID and Microsoft Artifact Signing remain optional
# defense in depth and are not release gates.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      evaluation_build:
        description: >-
          Stage an unsigned evaluation runtime for native smoke testing. This dispatch artifact is
          never assembled into a stable release bundle.
        type: boolean
        default: false
        required: false

permissions: {}

env:
  RELEASE_BASE_BRANCH: release/1.0
  RELEASE_REQUIRED_CHECKS: '["ci","workflow hygiene","Analyze (actions)","Analyze (javascript-typescript)","Build, scan, SBOM, smoke","ui"]'

jobs:
  stage:
    name: Stage and smoke portable asset (${{ matrix.platform_target }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_target: windows-x64
            runner: windows-latest
          - platform_target: macos-arm64
            runner: macos-15
          - platform_target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      checks: read
      contents: read
      statuses: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate stable tag and governed release authority
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # The matrix runs this leg on windows-latest, whose default shell is pwsh; the block
        # below is bash (a heredoc and $(...) substitutions) and fails to parse there with
        # "Missing file specification after redirection operator". Pin bash explicitly.
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          node <<'NODE'
          const { version } = require("./package.json");
          if (version.includes("-") || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("Portable release staging requires the exact stable package tag.");
          }
          NODE
          npm run check:release-required-workflows
          npm run check:portable-approvals
          RELEASE_SHA="$(git rev-parse HEAD)" node scripts/verify-release-required-checks.mjs
      - name: Validate approved runtime inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run check:portable-approvals
      - name: Run executable secure-read adversarial harness
        run: node native/secure-workspace-read/test-protocol.mjs
      - name: Provision the pinned USearch native addon
        run: npm run provision:usearch
      - name: Prepare approved sidecar payloads
        run: node scripts/prepare-approved-sidecar-payloads.mjs --target ${{ matrix.platform_target }}
      - name: Stage stable unsigned runtime for Keiko release trust
        if: ${{ github.event_name == 'push' }}
        run: node scripts/run-portable-assets-stage.mjs --target ${{ matrix.platform_target }} --release
      - name: Stage unsigned runtime for manual smoke
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target ${{ matrix.platform_target }}
      - name: Stage unsigned evaluation runtime for manual smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target ${{ matrix.platform_target }} --evaluation
      - name: Functionally smoke the staged USearch addon
        run: node scripts/smoke-portable-usearch.mjs .portable-runtime/staging/${{ matrix.platform_target }} ${{ matrix.platform_target }}
      - name: Smoke test the staged artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target ${{ matrix.platform_target }}
      - name: Functionally smoke the unsigned secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/${{ matrix.platform_target }} ${{ matrix.platform_target }} --load
      - name: Build unsigned Windows setup companion
        if: runner.os == 'Windows'
        run: node scripts/build-windows-portable-setup.mjs --stage-root .portable-runtime/staging/${{ matrix.platform_target }}
      - name: Upload staged target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-stage-${{ matrix.platform_target }}${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_build && '-evaluation-unsigned' || '' }}
          path: .portable-runtime/staging/${{ matrix.platform_target }}
          if-no-files-found: error
          retention-days: 30

  stage-linux-manual:
    name: Stage and smoke portable asset (linux-x64, manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Linux portable launcher native quality
        run: ./scripts/check-linux-portable-launcher.sh
      - name: Validate approved runtime inputs
        run: npm run check:portable-approvals
      - name: Provision the pinned USearch native addon
        run: npm run provision:usearch
      - name: Prepare approved sidecar payloads
        run: node scripts/prepare-approved-sidecar-payloads.mjs --target linux-x64
      - name: Stage unsigned runtime for manual smoke
        if: ${{ !inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target linux-x64
      - name: Stage unsigned evaluation runtime for manual smoke
        if: ${{ inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target linux-x64 --evaluation
      - name: Functionally smoke the staged USearch addon
        run: node scripts/smoke-portable-usearch.mjs .portable-runtime/staging/linux-x64 linux-x64
      - name: Smoke test the staged artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target linux-x64
      - name: Functionally smoke the unsigned secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/linux-x64 linux-x64 --load
      - name: Upload staged target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-stage-linux-x64${{ inputs.evaluation_build && '-evaluation-unsigned' || '' }}
          path: .portable-runtime/staging/linux-x64
          if-no-files-found: error
          retention-days: 30

  stage-linux-production:
    name: Stage, qualify, and attest portable asset (linux-x64)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: portable-release-signing
    permissions:
      checks: read
      contents: read
      id-token: write
      statuses: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate stable tag and governed release authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          node <<'NODE'
          const { version } = require("./package.json");
          if (version.includes("-") || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("Portable release staging requires the exact stable package tag.");
          }
          NODE
          npm run check:release-required-workflows
          npm run check:portable-approvals
          RELEASE_SHA="$(git rev-parse HEAD)" node scripts/verify-release-required-checks.mjs
      - name: Run Linux portable launcher native quality
        run: ./scripts/check-linux-portable-launcher.sh
      - name: Provision the pinned USearch native addon
        run: npm run provision:usearch
      - name: Prepare approved sidecar payloads
        run: node scripts/prepare-approved-sidecar-payloads.mjs --target linux-x64
      - name: Stage stable runtime for Keiko release trust
        run: node scripts/run-portable-assets-stage.mjs --target linux-x64 --release
      - name: Functionally smoke the staged USearch addon
        run: node scripts/smoke-portable-usearch.mjs .portable-runtime/staging/linux-x64 linux-x64
      - name: Smoke test the staged artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target linux-x64
      - name: Functionally smoke the secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/linux-x64 linux-x64 --load
      - name: Bind the reviewed Linux production payload
        run: node scripts/linux-portable-signing.mjs prepare --stage-root .portable-runtime/staging/linux-x64
      - name: Qualify the exact Linux runtime and namespace gateway
        run: node scripts/qualify-linux-runtime-release.mjs --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA" --test-report "$RUNNER_TEMP/linux-runtime-tests.json"
      - name: Attest the exact qualification receipt with GitHub OIDC
        run: node scripts/sign-linux-runtime-qualification.mjs "$GITHUB_WORKSPACE/.portable-runtime/staging/linux-x64/payload/Keiko/.portable/runtime-qualification.json" "$GITHUB_WORKSPACE/.portable-runtime/staging/linux-x64/payload/Keiko/.portable/runtime-qualification.sigstore.json"
      - name: Seal and verify the production Linux archive
        run: node scripts/linux-portable-signing.mjs finalize --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA"
      - name: Smoke test the verified production artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target linux-x64
      - name: Run secure-read executable consistency harness
        run: node native/secure-workspace-read/test-protocol.mjs --binary .portable-runtime/staging/linux-x64/payload/Keiko/runtime/native/keiko-secure-workspace-read
      - name: Upload verified Linux target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-stage-linux-x64
          path: .portable-runtime/staging/linux-x64
          if-no-files-found: error
          retention-days: 30

  qualify-linux-production:
    name: Fresh native qualification (linux-x64)
    needs: stage-linux-production
    if: ${{ needs.stage-linux-production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download immutable verified Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-stage-linux-x64
          path: .portable-runtime/staging/linux-x64
      - name: Re-verify the offline Sigstore bundle, archive, and production discovery
        run: node scripts/linux-portable-signing.mjs verify --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA"
      - name: Re-run real namespace-gateway qualification against the sealed receipt
        run: node scripts/qualify-linux-runtime-release.mjs --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA" --test-report "$RUNNER_TEMP/linux-runtime-tests.json" --verify-only true
      - name: Functionally requalify the secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/linux-x64 linux-x64 --load
      - name: Run secure-read executable consistency harness
        run: node native/secure-workspace-read/test-protocol.mjs --binary .portable-runtime/staging/linux-x64/payload/Keiko/runtime/native/keiko-secure-workspace-read

  assemble:
    name: Assemble portable release-trust bundle
    needs: [stage, stage-linux-production, qualify-linux-production]
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && needs.stage.result == 'success' && needs.stage-linux-production.result == 'success' && needs.qualify-linux-production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download staged target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-stage-*
          path: portable-release-assets/artifacts
      - name: Assemble and validate the release asset bundle
        run: node scripts/assemble-portable-release-assets.mjs --bundle-root portable-release-assets --commit-sha "$GITHUB_SHA" --release-tag "$GITHUB_REF_NAME" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --version "$(node -p 'require("./package.json").version')"
      - name: Attest build provenance for portable release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            portable-release-assets/artifacts/*/keiko-*.zip
            portable-release-assets/artifacts/windows-x64/keiko-windows-x64-setup.exe
      - name: Attest build provenance for portable SBOM documents
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: "portable-release-assets/artifacts/*/evidence/sbom.cdx.json"
      - name: Attest SBOM for windows-x64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/windows-x64/keiko-windows-x64.zip
          sbom-path: portable-release-assets/artifacts/windows-x64/evidence/sbom.cdx.json
      - name: Attest SBOM for linux-x64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/linux-x64/keiko-linux-x64.zip
          sbom-path: portable-release-assets/artifacts/linux-x64/evidence/sbom.cdx.json
      - name: Attest SBOM for macos-arm64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/macos-arm64/keiko-macos-arm64.zip
          sbom-path: portable-release-assets/artifacts/macos-arm64/evidence/sbom.cdx.json
      - name: Attest SBOM for macos-x64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/macos-x64/keiko-macos-x64.zip
          sbom-path: portable-release-assets/artifacts/macos-x64/evidence/sbom.cdx.json
      - name: Upload release-trust candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-release-assets
          path: portable-release-assets
          if-no-files-found: error
          retention-days: 90
