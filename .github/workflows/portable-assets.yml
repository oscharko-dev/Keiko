name: Portable assets

# Builds and natively smokes the complete portable release on Linux, Windows, and both macOS
# architectures. Every stable artifact receives the mandatory Ed25519 release signature after
# GitHub assigns immutable release and asset IDs. Linux additionally carries an OIDC-attested
# runtime-qualification receipt. Apple Developer ID and Microsoft Artifact Signing remain optional
# defense in depth and are not release gates.

on:
  push:
    # A dev push rehearses the stable release end to end without publishing it (rehearsal-readiness
    # decides whether the dev head's version is approved at all); a stable v* tag runs the release.
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      evaluation_build:
        description: >-
          Stage an unsigned evaluation runtime for native smoke testing. This dispatch artifact is
          never assembled into a stable release bundle.
        type: boolean
        default: false
        required: false

permissions: {}

concurrency:
  # Only the newest dev head needs its rehearsal, so dev pushes share one group and a superseded
  # rehearsal is cancelled. Every tag run and manual dispatch gets a group of its own: a shared group
  # would still cancel a queued run when a third one arrives, even without cancel-in-progress.
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'portable-assets-dev-rehearsal' || format('portable-assets-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

env:
  RELEASE_BASE_BRANCH: release/1.0
  RELEASE_REQUIRED_CHECKS: '["ci","workflow hygiene","Analyze (actions)","Analyze (javascript-typescript)","Build, scan, SBOM, smoke","ui"]'

jobs:
  rehearsal-readiness:
    name: Stable release rehearsal readiness
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Decide whether this dev head's version is approved for a stable release
        id: readiness
        # Not approved yet is a named status, not a failure: the rehearsal jobs below are skipped and
        # the summary says why, so the lane does not stand red between two releases.
        run: node scripts/portable-rehearsal-readiness.mjs

  stage:
    name: Stage and smoke portable asset (${{ matrix.platform_target }})
    needs: rehearsal-readiness
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.ref == 'refs/heads/dev' && needs.rehearsal-readiness.outputs.ready == 'true')))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_target: windows-x64
            runner: windows-latest
          - platform_target: macos-arm64
            runner: macos-15
          - platform_target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out commit
        # The checkout binds the event commit; this proves it, because every artifact below is bound
        # to GITHUB_SHA. Windows runs pwsh by default, and the test below is bash.
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate stable tag and governed release authority
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # The matrix runs this leg on windows-latest, whose default shell is pwsh; the block
        # below is bash (a heredoc and $(...) substitutions) and fails to parse there with
        # "Missing file specification after redirection operator". Pin bash explicitly.
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          node <<'NODE'
          const { version } = require("./package.json");
          if (version.includes("-") || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("Portable release staging requires the exact stable package tag.");
          }
          NODE
          npm run check:release-required-workflows
          npm run check:portable-approvals
      - name: Validate approved runtime inputs
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' }}
        run: npm run check:portable-approvals
      - name: Validate the release workflow authority a rehearsal will face
        # The tag identity above needs a stable tag; the workflow authority does not, so a rehearsal
        # still proves it.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        run: npm run check:release-required-workflows
      - name: Run executable secure-read adversarial harness
        run: node native/secure-workspace-read/test-protocol.mjs
      - name: Provision the pinned USearch native addon
        run: npm run provision:usearch
      - name: Prepare approved sidecar payloads
        run: node scripts/prepare-approved-sidecar-payloads.mjs --target ${{ matrix.platform_target }}
      - name: Stage stable unsigned runtime for Keiko release trust
        if: ${{ github.event_name == 'push' }}
        run: node scripts/run-portable-assets-stage.mjs --target ${{ matrix.platform_target }} --release
      - name: Stage unsigned runtime for manual smoke
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target ${{ matrix.platform_target }}
      - name: Stage unsigned evaluation runtime for manual smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target ${{ matrix.platform_target }} --evaluation
      - name: Functionally smoke the staged USearch addon
        run: node scripts/smoke-portable-usearch.mjs .portable-runtime/staging/${{ matrix.platform_target }} ${{ matrix.platform_target }}
      - name: Smoke test the staged artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target ${{ matrix.platform_target }}
      - name: Functionally smoke the unsigned secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/${{ matrix.platform_target }} ${{ matrix.platform_target }} --load
      - name: Build unsigned Windows setup companion
        if: runner.os == 'Windows'
        run: node scripts/build-windows-portable-setup.mjs --stage-root .portable-runtime/staging/${{ matrix.platform_target }}
      - name: Upload staged target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-stage-${{ matrix.platform_target }}${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_build && '-evaluation-unsigned' || '' }}
          path: .portable-runtime/staging/${{ matrix.platform_target }}
          # The portable contract stores its evidence under .portable/ (runtime-activation.json,
          # runtime-qualification.json). upload-artifact excludes hidden files by default, so
          # without this the consumer downloads a tree with no evidence at all - which is how
          # assemble failed on the v1.0.0 release, 2026-09-13: "missing runtime activation manifest".
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  stage-linux-manual:
    name: Stage and smoke portable asset (linux-x64, manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Linux portable launcher native quality
        run: ./scripts/check-linux-portable-launcher.sh
      - name: Validate approved runtime inputs
        run: npm run check:portable-approvals
      - name: Provision the pinned USearch native addon
        run: npm run provision:usearch
      - name: Prepare approved sidecar payloads
        run: node scripts/prepare-approved-sidecar-payloads.mjs --target linux-x64
      - name: Stage unsigned runtime for manual smoke
        if: ${{ !inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target linux-x64
      - name: Stage unsigned evaluation runtime for manual smoke
        if: ${{ inputs.evaluation_build }}
        run: node scripts/run-portable-assets-stage.mjs --target linux-x64 --evaluation
      - name: Functionally smoke the staged USearch addon
        run: node scripts/smoke-portable-usearch.mjs .portable-runtime/staging/linux-x64 linux-x64
      - name: Smoke test the staged artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target linux-x64
      - name: Functionally smoke the unsigned secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/linux-x64 linux-x64 --load
      - name: Upload staged target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-stage-linux-x64${{ inputs.evaluation_build && '-evaluation-unsigned' || '' }}
          path: .portable-runtime/staging/linux-x64
          # The portable contract stores its evidence under .portable/ (runtime-activation.json,
          # runtime-qualification.json). upload-artifact excludes hidden files by default, so
          # without this the consumer downloads a tree with no evidence at all - which is how
          # assemble failed on the v1.0.0 release, 2026-09-13: "missing runtime activation manifest".
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  stage-linux-production:
    name: Stage, qualify, and attest portable asset (linux-x64)
    needs: rehearsal-readiness
    if: ${{ !cancelled() && github.event_name == 'push' && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.ref == 'refs/heads/dev' && needs.rehearsal-readiness.outputs.ready == 'true')) }}
    runs-on: ubuntu-latest
    # A rehearsal never enters the signing environment: every protection rule must pass before a job
    # referencing an environment gets a runner, so a stable-tag policy or a required approval there
    # would stall each dev push, and a credential provisioned there must stay out of its reach.
    environment: ${{ github.ref == 'refs/heads/dev' && 'portable-release-rehearsal' || 'portable-release-signing' }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out commit
        # The qualification receipt and its signature are bound to GITHUB_SHA, so the staged bytes
        # must come from exactly that commit.
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate stable tag and governed release authority
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          node <<'NODE'
          const { version } = require("./package.json");
          if (version.includes("-") || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("Portable release staging requires the exact stable package tag.");
          }
          NODE
          npm run check:release-required-workflows
          npm run check:portable-approvals
      - name: Validate the release workflow authority a rehearsal will face
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          npm run check:release-required-workflows
          npm run check:portable-approvals
      - name: Setup Linux sandbox isolation
        uses: ./.github/actions/setup-sandbox-isolation
      - name: Run Linux portable launcher native quality
        run: ./scripts/check-linux-portable-launcher.sh
      - name: Provision the pinned USearch native addon
        run: npm run provision:usearch
      - name: Prepare approved sidecar payloads
        run: node scripts/prepare-approved-sidecar-payloads.mjs --target linux-x64
      - name: Stage stable runtime for Keiko release trust
        run: node scripts/run-portable-assets-stage.mjs --target linux-x64 --release
      - name: Functionally smoke the staged USearch addon
        run: node scripts/smoke-portable-usearch.mjs .portable-runtime/staging/linux-x64 linux-x64
      - name: Smoke test the staged artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target linux-x64
      - name: Functionally smoke the secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/linux-x64 linux-x64 --load
      - name: Bind the reviewed Linux production payload
        run: node scripts/linux-portable-signing.mjs prepare --stage-root .portable-runtime/staging/linux-x64
      - name: Qualify the exact Linux runtime and namespace gateway
        run: node scripts/qualify-linux-runtime-release.mjs --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA" --test-report "$RUNNER_TEMP/linux-runtime-tests.json"
      - name: Attest the exact qualification receipt with GitHub OIDC
        run: node scripts/sign-linux-runtime-qualification.mjs "$GITHUB_WORKSPACE/.portable-runtime/staging/linux-x64/payload/Keiko/.portable/runtime-qualification.json" "$GITHUB_WORKSPACE/.portable-runtime/staging/linux-x64/payload/Keiko/.portable/runtime-qualification.sigstore.json"
      - name: Seal and verify the production Linux archive
        # A rehearsal's certificate names refs/heads/dev, so it verifies against the rehearsal policy
        # and never offers its artifact to the product discovery, which accepts release signatures only.
        env:
          SIGNING_LANE: ${{ github.ref == 'refs/heads/dev' && 'rehearsal' || 'release' }}
        run: node scripts/linux-portable-signing.mjs finalize --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA" --lane "$SIGNING_LANE"
      - name: Smoke test the verified production artifact
        run: npm run smoke:portable-launch-setup -- --stage-root .portable-runtime/staging --stage-target linux-x64
      - name: Run secure-read executable consistency harness
        run: node native/secure-workspace-read/test-protocol.mjs --binary .portable-runtime/staging/linux-x64/payload/Keiko/runtime/native/keiko-secure-workspace-read
      - name: Upload verified Linux target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-stage-linux-x64
          path: .portable-runtime/staging/linux-x64
          # The portable contract stores its evidence under .portable/ (runtime-activation.json,
          # runtime-qualification.json). upload-artifact excludes hidden files by default, so
          # without this the consumer downloads a tree with no evidence at all - which is how
          # assemble failed on the v1.0.0 release, 2026-09-13: "missing runtime activation manifest".
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Pack the verified Linux tree for the fresh qualification
        # upload-artifact's zipped upload stores every file as 644 (its README, "Permission
        # Loss"), so a job that downloads portable-stage-linux-x64 holds a native helper it
        # cannot execute. The action's documented remedy is a tar uploaded as-is, which keeps
        # file modes and symlinks; assemble keeps consuming the zipped artifact above.
        run: tar -C .portable-runtime/staging -cpf "$RUNNER_TEMP/linux-x64-qualification-tree.tar" linux-x64
      - name: Upload the verified Linux tree with its file modes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # With archive: false the file name is the artifact name; it must not match the
          # portable-stage-* pattern assemble downloads.
          path: ${{ runner.temp }}/linux-x64-qualification-tree.tar
          archive: false
          if-no-files-found: error
          retention-days: 30

  qualify-linux-production:
    name: Fresh native qualification (linux-x64)
    needs: stage-linux-production
    if: ${{ needs.stage-linux-production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build workspace packages
        # This job installs with --ignore-scripts and never stages the product, so nothing
        # here produces packages/*/dist. linux-portable-signing.mjs imports the built
        # keiko-server production discovery module, which is exactly how the v1.0.0 release
        # failed on 2026-09-13 (ERR_MODULE_NOT_FOUND on the first ever run of this job).
        # stage-linux-production gets the same output as a side effect of staging.
        run: npm run build:packages
      - name: Setup Linux sandbox isolation
        uses: ./.github/actions/setup-sandbox-isolation
      - name: Download the verified Linux tree with its file modes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x64-qualification-tree.tar
          path: ${{ runner.temp }}/linux-x64-qualification-tree
      - name: Unpack the verified Linux tree
        # -p keeps the modes the tar carries; the helper below is executed, not only hashed.
        run: |
          test -f "$RUNNER_TEMP/linux-x64-qualification-tree/linux-x64-qualification-tree.tar"
          mkdir -p .portable-runtime/staging
          tar -C .portable-runtime/staging -xpf "$RUNNER_TEMP/linux-x64-qualification-tree/linux-x64-qualification-tree.tar"
      - name: Re-verify the offline Sigstore bundle, archive, and production discovery
        env:
          SIGNING_LANE: ${{ github.ref == 'refs/heads/dev' && 'rehearsal' || 'release' }}
        run: node scripts/linux-portable-signing.mjs verify --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA" --lane "$SIGNING_LANE"
      - name: Re-run real namespace-gateway qualification against the sealed receipt
        run: node scripts/qualify-linux-runtime-release.mjs --stage-root .portable-runtime/staging/linux-x64 --source-commit-sha "$GITHUB_SHA" --test-report "$RUNNER_TEMP/linux-runtime-tests.json" --verify-only true
      - name: Functionally requalify the secure-read helper
        run: npm run smoke:portable-secure-read -- .portable-runtime/staging/linux-x64 linux-x64 --load
      - name: Run secure-read executable consistency harness
        run: node native/secure-workspace-read/test-protocol.mjs --binary .portable-runtime/staging/linux-x64/payload/Keiko/runtime/native/keiko-secure-workspace-read

  assemble:
    name: Assemble portable release-trust bundle
    needs: [stage, stage-linux-production, qualify-linux-production]
    if: ${{ always() && github.event_name == 'push' && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || github.ref == 'refs/heads/dev') && needs.stage.result == 'success' && needs.stage-linux-production.result == 'success' && needs.qualify-linux-production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspace packages
        # --ignore-scripts builds nothing, and assemble derives each qualification receipt from its
        # producer, whose shared evidence library imports @oscharko-dev/keiko-contracts from
        # packages/*/dist. The v1.0.0 release died here on 2026-09-14 with ERR_MODULE_NOT_FOUND.
        run: npm run build:packages
      - name: Download staged target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-stage-*
          path: portable-release-assets/artifacts
      - name: Assemble and validate the release asset bundle
        run: node scripts/assemble-portable-release-assets.mjs --bundle-root portable-release-assets --commit-sha "$GITHUB_SHA" --release-tag "v$(node -p 'require("./package.json").version')" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --version "$(node -p 'require("./package.json").version')"
      - name: Attest build provenance for portable release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            portable-release-assets/artifacts/*/keiko-*.zip
            portable-release-assets/artifacts/windows-x64/keiko-windows-x64-setup.exe
      - name: Attest build provenance for portable SBOM documents
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: "portable-release-assets/artifacts/*/evidence/sbom.cdx.json"
      - name: Attest SBOM for windows-x64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/windows-x64/keiko-windows-x64.zip
          sbom-path: portable-release-assets/artifacts/windows-x64/evidence/sbom.cdx.json
      - name: Attest SBOM for linux-x64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/linux-x64/keiko-linux-x64.zip
          sbom-path: portable-release-assets/artifacts/linux-x64/evidence/sbom.cdx.json
      - name: Attest SBOM for macos-arm64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/macos-arm64/keiko-macos-arm64.zip
          sbom-path: portable-release-assets/artifacts/macos-arm64/evidence/sbom.cdx.json
      - name: Attest SBOM for macos-x64 portable artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: portable-release-assets/artifacts/macos-x64/keiko-macos-x64.zip
          sbom-path: portable-release-assets/artifacts/macos-x64/evidence/sbom.cdx.json
      - name: Upload release-trust candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # A rehearsal bundle carries a name the publisher refuses (it accepts portable-release-assets
          # from a stable-tag push only), so a rehearsal can never be released.
          name: ${{ github.ref == 'refs/heads/dev' && 'portable-rehearsal-assets' || 'portable-release-assets' }}
          path: portable-release-assets
          # The portable contract stores its evidence under .portable/ (runtime-activation.json,
          # runtime-qualification.json). upload-artifact excludes hidden files by default, so
          # without this the consumer downloads a tree with no evidence at all - which is how
          # assemble failed on the v1.0.0 release, 2026-09-13: "missing runtime activation manifest".
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  request-publish:
    name: Request the publish of this stable build
    needs: assemble
    # ADR-0177 D8: a stable tag build asks release.yml to publish exactly this run's bundle. The dev
    # rehearsal and manual dispatches never do, and the publish job keeps its npm-publish approval.
    if: ${{ needs.assemble.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      # Dispatching release.yml and cancelling an older candidate's publish that still waits for its
      # approval. Neither can publish: every publish job still needs the npm-publish review.
      actions: write
      checks: read
      contents: read
      statuses: read
    # The tag is written on the dev push, so this build runs beside the commit's CI; this job waits
    # for the six release-required checks (at most 30 minutes) before it asks for a publish.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Verify the release-required checks on the tag commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: RELEASE_SHA="$GITHUB_SHA" node scripts/verify-release-required-checks.mjs
      - name: Request the publish of this build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/request-release-publish.mjs
