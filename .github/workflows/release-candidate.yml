name: Release candidate

# ADR-0177 D8: on every dev push, a dev head whose version is approved for every portable target and
# not yet published becomes the release candidate, and a GitHub App that may change tags points
# v<version> at it at once. The tag push runs the signed stable build in portable-assets.yml beside
# the commit's CI. ADR-0177 D9: once a release owner pressed the release button (release.yml on dev)
# for the commit the tag points at, no later dev push moves the tag away from that request, and
# release-advance.yml starts the publish when the build and the release-required checks are green.
# Every decision lives in scripts/lib/release-candidate.mjs.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  # The newest green dev head supersedes an older candidate. Cancelling is safe at any point: the plan
  # job writes nothing, and the tag write is a single API call that is read back.
  group: release-candidate
  cancel-in-progress: true

jobs:
  plan:
    name: Decide the release candidate
    # Only dev is a candidate, and the plan compares the pushed commit with the live dev head.
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    outputs:
      action: ${{ steps.plan.outputs.action }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Resolve the candidate commit
        id: candidate
        env:
          PUSHED_SHA: ${{ github.sha }}
        run: |
          sha="$PUSHED_SHA"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release-candidate: the candidate commit is not a full SHA." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Decide whether the release tag should point at this commit
        id: plan
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs --plan

  tag:
    name: Point the release tag at the candidate
    needs: plan
    # `plan` is dev-only and legitimately skipped on any other ref. GitHub's implicit success() gate
    # then hides the skip through this chain (incident-register row 10, Epic #3495): the run
    # concludes success while tag never ran. Declare the status function explicitly so the intent
    # is visible to readers and to the workflow-trigger-scenarios test.
    if: ${{ !cancelled() && (needs.plan.outputs.action == 'create' || needs.plan.outputs.action == 'move') }}
    runs-on: ubuntu-latest
    # The GitHub App credentials exist only in this environment, and only dev may deploy to it.
    environment: release-tagging
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Mint the release tag token
        id: tag-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KEIKO_RELEASE_TAG_APP_CLIENT_ID }}
          private-key: ${{ secrets.KEIKO_RELEASE_TAG_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Point the release tag at the candidate
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          KEIKO_RELEASE_TAG_TOKEN: ${{ steps.tag-token.outputs.token }}
        run: node scripts/release-candidate.mjs --apply
