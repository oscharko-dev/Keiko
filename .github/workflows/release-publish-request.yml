name: Release publish request

# Event-driven publish request (#3498, Epic #3495). The v1.0.0 tag build sat 30 minutes in a
# release-verify job polling for CI, CodeQL, workflow hygiene and portable-assets to go green, and
# every rerun consumed macOS and Windows minutes on the same commit. Instead of a job that WAITS
# for those verdicts, this workflow REACTS to their completion event: when one of the four
# workflows on a v* tag concludes, it checks whether every one of the four is now green on that
# same head sha and — if so — dispatches release.yml with publish=true. When any is not yet green,
# the run records the decision and exits. There is no attempt count, no sleep loop, no time budget:
# each firing is a single event-driven decision.
#
# Same posture as .github/workflows/infra-failure-retry.yml: workflow_run always runs the default
# branch's definition of THIS file, and this file checks out the default branch (never
# workflow_run.head_sha) so a pull-request head can never smuggle its own dispatch code in.
# `actions: write` is used only to POST the release dispatch — which is refused before any side
# effect if the head is not a v* tag or if any observed workflow is not green on it.

on:
  workflow_run:
    workflows:
      # The four required checks in RELEASE_REQUIRED_CHECKS (release.yml env) whose green status on
      # the tag SHA authorizes publication. The list is intentionally spelled here as workflow
      # display names — workflow_run keys on the DISPLAY NAME — and pinned by the workflow-name
      # contract test (RELEASE_REQUIRED_CHECKS is the display-name set the release path verifies
      # against).
      - CI
      - CodeQL
      - Workflow hygiene
      - Portable assets
    types:
      - completed
  # Same shape as infra-failure-retry: allow an operator to reclassify a completed release-relevant
  # workflow run manually. `dry-run` decides without dispatching.
  workflow_dispatch:
    inputs:
      head_sha:
        description: Head SHA that just went green (the tag SHA)
        required: true
        type: string
      mode:
        description: dry-run logs the decision only; enforce may dispatch release.yml
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - enforce

permissions: {}

# One request per observed head; a superseded observer would leave the release decision without a
# decision record. Never cancelled.
concurrency:
  group: release-publish-request-${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  request-publish:
    name: Request the publish when every check is green on the tag SHA
    # The observed workflow itself must have concluded success, and it must have carried a v* tag
    # ref (a dev-branch push does not authorize a publish request). Manual dispatch bypasses these
    # so the operator can retry a stalled decision on a specific SHA.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && startsWith(github.event.workflow_run.head_branch, 'v')
      && !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `POST /repos/{owner}/{repo}/actions/workflows/release.yml/dispatches` requires actions:write.
      # The dispatch payload is refused by scripts/decide-release-publish-request.mjs before this
      # step is reached if the observed head is not a v* tag or if any observed workflow is not
      # green on it.
      actions: write
      # scripts/decide-release-publish-request.mjs reads workflow_runs and check-runs on the
      # observed head to verify every required check is green.
      checks: read
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # workflow_run runs the default branch's definition; the script it invokes must come from
          # the same tree. Checking out workflow_run.head_sha would run a pull request's own code
          # with actions:write — the specific risk workflow_run carries.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Decide whether every required check is green on the observed head
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OBSERVED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
          OBSERVER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'enforce' }}
        run: |
          set -euo pipefail
          node scripts/decide-release-publish-request.mjs \
            --head-sha "$OBSERVED_HEAD_SHA" \
            --mode "$OBSERVER_MODE" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"
