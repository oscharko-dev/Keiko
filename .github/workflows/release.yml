name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tagged main commit to npm"
        type: boolean
        required: false
        default: false
      npm_dist_tag:
        description: "npm dist-tag to publish under"
        type: choice
        required: false
        default: beta
        options:
          - beta
          - next
          - latest

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Validate release source
        env:
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Release workflow must run from a version tag, got ${GITHUB_REF_TYPE}." >&2
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

          if [ "${head_sha}" != "${main_sha}" ]; then
            echo "Tag ${GITHUB_REF_NAME} must point at origin/main." >&2
            echo "tag:  ${head_sha}" >&2
            echo "main: ${main_sha}" >&2
            exit 1
          fi

          case "${NPM_DIST_TAG}" in
            beta|next|latest) ;;
            *)
              echo "Unsupported npm dist-tag: ${NPM_DIST_TAG}" >&2
              exit 1
              ;;
          esac

          if [[ "${package_version}" == *-* && "${NPM_DIST_TAG}" == "latest" ]]; then
            echo "Prerelease versions must not be published with the latest dist-tag." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build publish artifact
        run: |
          npm run clean
          npm run build
          npm run prepare:bin
          npm run build:ui
          npm run prune:package-native-optionals
      - name: Publish package
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG" --ignore-scripts
