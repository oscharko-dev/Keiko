name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after all release gates pass"
        type: boolean
        required: false
        default: false
      npm_dist_tag:
        description: "npm dist-tag to publish under"
        type: choice
        required: false
        default: beta
        options:
          - beta
          - next
          - latest
      portable_assets_manifest:
        description: "Path to reviewed portable assets manifest for stable latest publishes"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BASE_BRANCH: release/0.2
  # Dependency Review is enforced on release PRs. It is intentionally omitted here because
  # the check is pull_request-only and is not emitted on the tagged squash commit.
  RELEASE_REQUIRED_CHECKS: '["ci","actionlint","Verify pinned action SHAs","Analyze (actions)","Analyze (javascript-typescript)","Build, scan, SBOM, smoke","ui"]'

jobs:
  release-verify:
    name: Release verification
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      statuses: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { version } = require("./package.json");
          const releaseTag = process.env.RELEASE_TAG;
          if (releaseTag !== `v${version}`) {
            throw new Error(`Release tag ${releaseTag} does not match package version ${version}.`);
          }
          NODE
      - name: Validate required-check workflow names
        run: npm run check:release-required-workflows
      - name: Verify required checks for tagged SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: RELEASE_SHA="$(git rev-parse HEAD)" node scripts/verify-release-required-checks.mjs
      - name: Validate release manifest plan
        run: npm run release:plan -- --tag beta

  publish:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      id-token: write
      statuses: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Validate required-check workflow names
        run: npm run check:release-required-workflows
      - name: Verify required checks for release SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: RELEASE_SHA="$(git rev-parse HEAD)" node scripts/verify-release-required-checks.mjs
      - name: Validate publish dist-tag
        env:
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { version } = require("./package.json");
          const tag = process.env.NPM_DIST_TAG;
          const releaseTag = process.env.RELEASE_TAG;
          if (releaseTag !== `v${version}`) {
            throw new Error(`Release tag ${releaseTag} does not match package version ${version}.`);
          }
          if (!["beta", "next", "latest"].includes(tag)) {
            throw new Error(`Unsupported npm dist-tag: ${tag}`);
          }
          if (version.includes("-") && tag === "latest") {
            throw new Error("Prerelease versions must not be published with the latest dist-tag.");
          }
          NODE
      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEIKO_PORTABLE_ASSETS_MANIFEST: ${{ inputs.portable_assets_manifest }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          KEIKO_RELEASE_OWNER_GITHUB_LOGINS: ${{ vars.KEIKO_RELEASE_OWNER_GITHUB_LOGINS }}
        run: npm run release:publish -- --tag "$NPM_DIST_TAG"
