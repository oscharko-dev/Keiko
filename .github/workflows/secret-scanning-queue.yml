# Epic #2291's definition of done includes "GitHub reports no open generic secret alerts". #2292
# verified that once, by hand, and the queue refilled eight days later: alert #17 was created on
# 2026-07-20 and sat undispositioned for five weeks because nothing ever re-asked the question.
# `SECURITY.md` documented the triage procedure; no lane executed it.
#
# This lane is that procedure, on a schedule. It does NOT re-scan the repository — GitHub's secret
# scanning already does that. It asks a different question, the one that decayed: is every alert
# currently open one a human has actually dispositioned in the #2296 closeout document? A new,
# untriaged finding fails; a recorded synthetic fixture does not.
#
# Detection only, never repair. Closing an alert is a maintainer authorization, so the lane files or
# updates one tracking issue and stops — the same contract as `nightly-perf-evidence.yml`.
#
# No `npm ci`: the check imports only Node builtins and the repository's own `scripts/lib`, so the
# lane costs a checkout and a Node setup. `hide_secret=true` is always sent, so no literal secret
# value is ever requested — and nothing identifying an alert reaches a public surface either:
# this repository is public, its alert queue is not, and the summary and issue carry only the
# fact that something needs triage plus a pointer to the Security tab.
name: Secret scanning queue

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scanning-queue
  cancel-in-progress: false

jobs:
  triage-queue:
    name: Verify every open alert is dispositioned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Check the secret-scanning queue
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eo pipefail
          # The detail stays in the runner and is never published. This repository is PUBLIC, and so
          # are its Actions logs, job summaries and issues — but its secret-scanning alerts are not:
          # GitHub gates those behind write access even here. Printing "alert #N of type X is open"
          # on a public surface, once a day until someone acts, tells the world that a credential of
          # that type is still live. That is the disclosure this lane exists to help close, so the
          # public side carries a count and a pointer to the Security tab, nothing more.
          if node scripts/check-secret-scanning-queue.mjs > "${RUNNER_TEMP}/queue.txt" 2>&1; then
            status=clean
            summary="Secret-scanning queue: every open alert has a recorded disposition."
          else
            status=untriaged
            summary="Secret-scanning queue: at least one open alert has no recorded disposition. Details are deliberately withheld from this public log. See Security -> Secret scanning, and record the disposition in the closeout document."
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "${summary}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Report an untriaged queue
        if: steps.queue.outputs.status == 'untriaged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eo pipefail
          marker="keiko-secret-scanning-queue-untriaged"
          body="$(printf '%s\n\n%s\n\n<!-- %s -->\n' \
            'At least one open secret-scanning alert has no recorded disposition in docs/release/2296-dependency-security-closeout.md. Alert identifiers and types are deliberately omitted here because this issue is public while the alert queue is not: open Security -> Secret scanning to see which, disposition it in that document, then close the alert with the matching resolution.' \
            'Re-run this lane from the Actions tab to confirm the queue is clean.' \
            "${marker}")"
          # `set -e` matters here: a failed search must stop the step, not read as "no issue exists"
          # and file a duplicate every night.
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${marker}\" in:body" --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "Secret-scanning queue has an untriaged alert" --body "${body}"
          fi
      - name: Fail the lane when the queue is untriaged
        if: steps.queue.outputs.status == 'untriaged'
        run: exit 1
