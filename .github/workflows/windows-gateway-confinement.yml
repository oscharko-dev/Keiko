name: Windows gateway confinement development proof

# Explicit development lane for #3666/#3423. Only a disposable hosted runner changes WFP state.
# Development proof only; this does not qualify the production runtime.
on:
  push:
    branches: [fix/3666-windows-coding-runtime, feature/4068-windows-workbench]
  workflow_dispatch:
    inputs:
      verify_transport:
        description: "Require a real gateway connection and hostile port denial through the installed Workbench adapter"
        type: boolean
        default: false

permissions: {}

jobs:
  filter-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify governed Node.js and npm toolchain
        run: node scripts/check-runtime-toolchain.mjs --exact
      - name: Require disposable runner administrator context
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "The native WFP proof requires an administrator token on the hosted runner."
          }
          if ((Get-Service BFE).Status -ne 'Running') { throw "BFE is not running." }
      - name: Build Workbench server packages for the native adapter proof
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:packages
        shell: pwsh
      - name: Compile, analyze, validate and prove dynamic filter cleanup
        run: node scripts/testing/test-windows-gateway-filters.mjs --filter-lifecycle
      - name: Prove durable-deny guard cleanup after gateway permit revocation
        run: node scripts/testing/test-windows-gateway-filters.mjs --guarded-lifecycle
      - name: Prove real AppContainer gateway access and hostile loopback denial
        run: node scripts/testing/test-windows-gateway-filters.mjs --socket-proof
      - name: Exercise the installed service and Workbench adapter transport
        env:
          VERIFY_TRANSPORT: ${{ (github.event_name == 'push' && github.ref_name == 'feature/4068-windows-workbench') || inputs.verify_transport }}
        run: ./scripts/testing/test-windows-gateway-scm.ps1 -VerifyTransport:($env:VERIFY_TRANSPORT -eq 'true')
        shell: pwsh
