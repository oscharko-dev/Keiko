name: Workflow hygiene

# ADR-0159: one required `workflow hygiene` context runs actionlint, the pinned-SHA grep, zizmor and
# the OSV lockfile scan, at the same pinned versions and with the same configuration they had as four
# separate jobs. It lives in its own workflow file rather than in ci.yml because a workflow's `on:`
# block is per file, and this job's trigger surface must be the UNION of the four it replaces -
# including `ready_for_review`, which osv-scanner.yml declares and ci.yml does not. Adding that type
# to ci.yml would re-run the whole matrix for a 20-second scan and, under `cancel-in-progress: true`,
# restart an in-flight run from zero (ADR-0159 D2).
on:
  push:
    branches:
      - dev
      - feat/dev
      - feat/epic-open-code-engine-in-keiko-2473
      - feat/keiko-editor
      - feat/keiko-agent-native-editor-foundation-and-runtime
      - feat/prompt-enhancer-1307
      - feat/keiko-establish-governed-end-to-end-git-delivery
      - feat/keiko-voice-digital-twin
      - feat/keiko-isolated-task-workspaces
      - feat/keiko-colleague-like-voice-dialogue-mode
      - feat/keiko-repository-centered-desktop-workflow
      - feat/epic-built-in-editor-2285-M11
      - feat/epic-memoria-viva-2538
      - epic/coding-workbench-opencode-codex
      - "release/**"
  pull_request:
    branches:
      - dev
      - feat/dev
      - feat/epic-open-code-engine-in-keiko-2473
      - feat/keiko-editor
      - feat/keiko-agent-native-editor-foundation-and-runtime
      - feat/prompt-enhancer-1307
      - feat/keiko-establish-governed-end-to-end-git-delivery
      - feat/keiko-voice-digital-twin
      - feat/keiko-isolated-task-workspaces
      - feat/keiko-colleague-like-voice-dialogue-mode
      - feat/keiko-repository-centered-desktop-workflow
      - feat/epic-built-in-editor-2285-M11
      - feat/epic-memoria-viva-2538
      - epic/coding-workbench-opencode-codex
      - "release/**"
    # `ready_for_review` comes from osv-scanner.yml's pull-request lane, which this job absorbs. The
    # other three types are GitHub's default set, made explicit so the union is readable in one place.
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  # ADR-0139 D7: every required workflow also validates merge-queue groups.
  merge_group:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

# Mirrors ci.yml: a superseded pull-request run has no consumer left, while everything else gets a
# group of ONE (`github.run_id` is unique per run) so a push to dev can never be cancelled by the
# next one (Issue #2704).
concurrency:
  group: workflow-hygiene-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The four tools run as serial steps of one job. No step carries `continue-on-error`, so a failing
  # step fails the job and turns the single `workflow hygiene` context red.
  #
  # `!cancelled()` on the independent gate steps preserves what four separate jobs gave for free:
  # every gate reports on every run, so one CI round still surfaces every hygiene finding instead of
  # only the first. It never softens the verdict - a failed step fails the job whatever runs after it.
  #
  # It is paired with `steps.checkout.outcome != 'failure'` because `!cancelled()` also overrides the
  # default `success()` against the shared prerequisite. A gate must survive another GATE failing, not
  # a missing workspace: the pinned-SHA grep ends in `|| true`, so on an empty checkout it would
  # report "All action references are pinned" over a directory it never read. The job is red either
  # way - the checkout failed - but a gate that cannot read its input must skip, not reassure.
  #
  # The condition is `!= 'failure'` rather than `== 'success'` so that it fails safe. An id that is
  # renamed or dropped makes `steps.checkout.outcome` null; under `== 'success'` every guard would
  # then be false, all four gates would skip, and the required context would report green having
  # checked nothing. Under `!= 'failure'` that same mistake runs the gates instead.
  workflow-hygiene:
    name: workflow hygiene
    runs-on: ubuntu-latest
    # ADR-0135 D4: a required workflow carries a repository-owned timeout appropriate to the
    # pull-request feedback loop. The four jobs consolidated here complete in single-digit minutes
    # combined; 15 bounds a hung download or a stalled scanner without truncating a healthy run.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download and verify actionlint
        if: ${{ !cancelled() && steps.checkout.outcome != 'failure' }}
        run: |
          curl --proto '=https' -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml
      - name: Assert all action references are pinned to 40-hex SHAs
        if: ${{ !cancelled() && steps.checkout.outcome != 'failure' }}
        run: |
          set -euo pipefail
          violations=$(grep -rnE '^\s*-?\s*uses:' .github/workflows/ \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*docker://' \
            | grep -vE 'uses:\s*[A-Za-z0-9._/-]+@[0-9a-f]{40}([[:space:]]|$|#)' || true)
          if [ -n "$violations" ]; then
            echo "Unpinned action references (must pin to a full 40-hex commit SHA):"
            echo "$violations"
            exit 1
          fi
          echo "All action references are pinned to full commit SHAs."
      - name: Run zizmor
        # The standalone `zizmor` job's job-level `if:` reproduced verbatim at step level. A job
        # never skips because a sibling job failed, so `!cancelled()` is what makes the step-level
        # evaluation surface identical to the job-level one - the trigger condition itself is
        # unchanged, character for character.
        if: ${{ !cancelled() && steps.checkout.outcome != 'failure' && ((github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'merge_group') }}
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: "1.26.1"
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
      - name: Scan dependency manifests with OSV Scanner
        if: ${{ !cancelled() && steps.checkout.outcome != 'failure' }}
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # `--config` is passed explicitly rather than relying on directory auto-discovery, so the
          # committed triage record in osv-scanner.toml is the single, reviewable source of every
          # time-boxed waiver instead of something the scanner may or may not pick up per lockfile.
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./
