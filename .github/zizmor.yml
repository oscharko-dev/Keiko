# zizmor configuration for this repo's GitHub Actions workflows.
# https://docs.zizmor.sh/configuration/
#
# Every ignore below is a reviewed, documented risk acceptance, not a blanket suppression -
# each is scoped to specific lines with a reason. If the referenced file changes near those
# lines, re-run `zizmor .` locally: a shifted line either drops the ignore (the gate fails
# loudly) or, rarely, points at different code (re-verify the reasoning still applies).
rules:
  cache-poisoning:
    ignore:
      # The four coverage jobs added by Issue #2704 (coverage-packages, coverage-ui,
      # coverage-scripts, coverage-sonar) restore caches. None of them publishes, signs, or attests
      # anything - all four hold contents: read and nothing else. Every ci.yml job that DOES hold
      # signing-relevant permissions (currently build-scan-sbom-smoke and ui, both
      # attestations: write / id-token: write for artifact attestations) uses no cache at all and
      # keeps package-manager-cache: false, same as release.yml and portable-assets.yml - so there
      # is no privileged consumer for a cache poisoned here.
      # Each cached artifact is also re-verified AFTER restore, so a poisoned entry cannot be used
      # even inside the job that restored it: the npm download cache is re-verified per package
      # against the lockfile by `npm ci --ignore-scripts` (node_modules is never cached), and the
      # USearch runtime and the Sonar Scanner CLI archive are re-verified against their pinned
      # SHA-256 values by provision-usearch.mjs and by an explicit `sha256sum --check` that fails
      # the job closed.
      # Only the save-capable `actions/cache` needs an entry; the three `actions/cache/restore`
      # steps in the measuring jobs are not flagged, because a job that cannot write a cache cannot
      # poison one.
      # These anchors are LINE NUMBERS, so any edit that inserts a line above one of them silently
      # invalidates it and the required `zizmor` job goes red on an unrelated pull request. That is
      # not hypothetical - it is how this file last broke. `npm run check:zizmor-anchors` verifies
      # every anchor still points at a save-capable cache step and prints the corrected numbers,
      # locally, before the push.
      # The two anchors this block previously carried (ci.yml:63, ci.yml:172) were verified dead
      # before removal: `zizmor` reports zero cache-poisoning findings for the pre-#2704 ci.yml with
      # no ignore list at all.
      # USearch runtime: coverage-packages, coverage-ui, coverage-scripts
      - ci.yml:484
      - ci.yml:578
      - ci.yml:648
      # coverage-sonar: npm download cache (the one job that saves it), Sonar Scanner CLI archive
      - ci.yml:739
      - ci.yml:825
  ref-version-mismatch:
    ignore:
      # These two repository-owned gate actions are pinned to the exact reviewed commit that
      # introduced them. `gate-snapshot-1` is an audit label recorded by the dependency-currency
      # gate, not a mutable Git tag, so zizmor's online ref lookup cannot resolve it by design.
      # The executable reference remains a full 40-character SHA, and
      # `dev-quality-workflows.test.mjs` pins the same SHA for all nine invocations. Suppress only
      # zizmor's version-comment lookup finding; its immutable-pin check remains active.
      - ci.yml:264
      - ci.yml:458
      - ci.yml:564
      - ci.yml:634
      - ci.yml:732
      - ci.yml:890
      - ci.yml:987
      - ci.yml:1111
      - ci.yml:1228
  dangerous-triggers:
    ignore:
      # ADR-0161: the infrastructure-signature observer must see runs that have already completed, and
      # `workflow_run` is the only trigger GitHub offers for that. zizmor's warning is about the
      # classic misuse - a `workflow_run` workflow that checks out the triggering run's head and
      # executes it with the elevated token. This workflow does the opposite, by construction:
      # it checks out `github.event.repository.default_branch` explicitly (never
      # `workflow_run.head_sha`), it runs only committed repository code, its only write grant is
      # `actions: write`, and the two attacker-influenced values it reads - the run id and the mode -
      # go through `env:` indirection and are then re-validated against a positive-integer and a
      # two-literal pattern before either reaches an API path. The one privileged call it can make,
      # `rerun-failed-jobs`, re-executes the SAME tree that already ran and cannot introduce code.
      # Verified with the pinned scanner version: zizmor 1.26.1 reports this one finding for this
      # file and nothing else.
      - infra-failure-retry.yml:25
      # ADR-0170: the Keiko for Quality reviewer must see the pull-request head while executing only
      # protected-base code, and `pull_request_target` is the only trigger GitHub offers for that.
      # zizmor's warning is about the classic misuse - a workflow that checks out the candidate head
      # and runs it with the elevated token. This workflow does the opposite, by construction:
      # it checks out `github.workflow_sha` — the exact protected commit whose workflow GitHub is
      # executing — and fetches the head only as Git objects (`git fetch pull/N/head`), so no
      # candidate file is ever written to the working
      # tree, no candidate script/hook/action/package manager runs, and `--no-recurse-submodules`
      # keeps submodules uninitialised. Its only write grant is `pull-requests: write`;
      # `actions: write` exists nowhere in the workflow — the review store persists as a run
      # artifact (upload needs no scope; the cross-run lookup needs only `actions: read`, which
      # cannot dispatch). The poisoning BOUNDARY is the context-bound HMAC over the store, keyed
      # by a keiko-for-quality environment secret that the environment's protected-branches-only
      # policy withholds from candidate-base runs — the event/path/PR lookup predicates only
      # SELECT candidates (ADR-0170 D3). Also recorded there: the npm-publish required-reviewer
      # boundary in front of the one privileged dispatch target. It holds no contents-write,
      # checks-write, commit, push, or merge authority, and it
      # publishes no required status context. Approval is deliberately absent from that list:
      # `pull-requests: write` can submit an APPROVE review, so a compromised action could, and only
      # the pinned action's behaviour declines to (ADR-0170 D3).
      # The reviewer itself is an external action pinned to
      # a full commit SHA, so the executed implementation is immutable and outside candidate reach -
      # deliberately NOT a digest pin over this repository's own tree, which ADR-0169 D4 prohibits.
      # The model credential is environment-scoped and passed by variable name, never as an input.
      # Verified with the version the required job actually pins — zizmor 1.26.1, per
      # workflow-hygiene.yml — which reports this one finding for this file and nothing else.
      # This anchor is a LINE NUMBER: adding a comment above the trigger silently invalidates it and
      # turns the required context red. That happened once already, on this very entry.
      - keiko-for-quality.yml:14
  adhoc-packages:
    ignore:
      # Publishing deliberately uses the separately reviewed npm version required by ADR-0130;
      # bootstrapping npm is inherently outside the lockfile since it changes the binary that
      # later reads that lockfile. The version is pinned exactly (not @latest), which is the
      # practical mitigation for this specific operation (see the inline comment there).
      - release.yml:145
