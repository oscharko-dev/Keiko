# Qodo Merge (Qodo Code Review) configuration for the Keiko monorepo.
#
# Qodo is Keiko's advisory review product feeding Keiko for Quality (KFQ). It is
# comment-only: it posts a single summary review comment, updated in place per
# head, and never a check-run or a merge-authority approval. Qodo is NOT a
# required check and must never gate, approve, or unblock a merge. See
# docs/qa/qodo-review-policy.md and
# docs/adr/ADR-0135-deterministic-dev-delivery-and-keiko-for-quality.md.
#
# Concrete code standards live in ./best_practices.md and in the platform-managed
# compliance rules; this file pins the review methodology and the
# no-merge-authority safety invariant. check:qodo-config validates both files.

[pr_reviewer]
# Qodo must not gain merge authority: never auto-approve a pull request.
approve_pr_on_self_review = false
auto_approve_for_no_suggestions = false
# Update one review comment in place so the latest comment reflects the current
# head; KFQ binds Qodo evidence to the head SHA embedded in that comment.
persistent_comment = true
extra_instructions = """
Treat AGENTS.md, CONTRIBUTING.md, docs/qa/keiko-for-quality.md,
docs/qa/qodo-review-policy.md, and every applicable or changed ADR as binding; an
ADR overrides AGENTS.md, so report any conflict rather than choosing a convenient
interpretation. Anchor these invariants (full text in
docs/adr/ADR-0129-product-wide-authority-and-autonomy-model.md and
docs/adr/ADR-0135-deterministic-dev-delivery-and-keiko-for-quality.md):

- A local human selects or accepts the task, mode, Authority Envelope, and
  deployment ceiling. Invalid, expired, missing, exhausted, unsupported,
  workspace-escaping, sensitive-path, secret-exfiltrating, or platform-restricted
  authority fails closed in every mode.
- Only the direct app-bound required checks on the exact current head authorize
  GitHub native auto-merge. A raw bot approval or processing check is not final
  merge authority. Missing, skipped, neutral, cancelled, timed-out, differently
  produced, or unparseable current-head evidence is blocking.
- Findings, comments, and manifests contain counts, hashes, scopes, statuses, and
  safe labels only; never quote raw secrets, payload bodies, customer data,
  private endpoints, or PII in a finding.
- Trace each changed external or privileged flow end to end and validate hostile
  workspace input, model output, connector data, HTTP input, persisted rows, and
  generated artifacts before processing them. Keep provider SDKs inside
  keiko-model-gateway and route file patches through the owning tools boundary.

Qodo is advisory. Do not block merges, auto-approve, apply an approval label, or
arm auto-merge. Assume every pull request targeting `dev` is a large,
completed-epic integration PR: review all changed production source, tests for
critical behavior, workflows, migrations, manifests, public contracts, and
trust-boundary documentation before binary visual evidence, snapshots, lockfiles,
or generated artifacts. If service limits prevent complete inspection of that
executable and trust-boundary surface, fail closed and identify the unreviewed
files instead of approving the PR. A clean verdict requires every finding at every
severity to be resolved and review evidence for the exact current head. Never
force-push, push directly to `dev`, dismiss findings to obtain green status, arm
auto-merge before the direct app-bound required checks settle, or weaken a gate.
"""

[pr_code_suggestions]
extra_instructions = """
Apply the project standards in best_practices.md. Review the whole defect class at
the layer that owns the invariant rather than patching one call site, and reject
duplicated workspace, graph, relationship, policy, evidence, memory, connector,
workflow, or UI subsystems when an existing subsystem can be extended. Every
behavioural finding needs an owning-layer fix plus a failure-first regression or
boundary test that fails without the fix; a happy-path test alone is insufficient
for a trust boundary.
"""
