# OSV Scanner triage record (ADR-0002 supply-chain baseline).
#
# The `Scan dependency lockfiles` gate stays fail-closed: every entry below is an explicit,
# time-boxed decision with a recorded reason, not a blanket suppression. `ignoreUntil` forces the
# entry back through this gate on that date, so a stale waiver cannot outlive its justification.
# Nothing here weakens the scan for shipped dependencies — only build-time-only findings may be
# recorded: ones with no upstream fix, or whose patched release cannot be adopted without a separately
# governed gate change (that entry names the change and its follow-up). Each must state why it cannot
# reach a user.
#
# Each entry is bound to one advisory id, never to a package: a `[[PackageOverrides]]` rule would
# also hide every present and future advisory of that package, and osv-scanner cannot express
# "this id AND only in the dev group". A different advisory against the same package still fails.
#
# History: the GHSA-mh99-v99m-4gvg brace-expansion waiver (recorded during #2696, PR #2700) was
# removed when its own revisit condition arrived: upstream shipped patched releases on both
# affected lines and the lockfile moved to 1.1.18/5.0.9, so the id-wide suppression would only
# have hidden a reintroduced vulnerable release from the one gate positioned to catch it. The
# fallow GHSA-h4fr-cmh5-qr62 and GHSA-jfwm-3p3c-6hx5 waivers (#3898) were removed on their revisit
# condition: the owner decided the duplication gate (generated files excluded, the rest frozen in a
# shrink-only baseline, `scripts/check-semantic-duplication.mjs`) and fallow moved to 3.35.0.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-30
reason = """
braces stack exhaustion through deeply nested brace patterns (CVE-2026-93687, high; CVSS 3.1 7.5,
CVSS 4.0 8.7). Build-time only and unfixable upstream at the time of writing: the advisory covers
every release through 3.0.3, which is the latest published braces, and names no patched version.

Reach: the lockfile holds exactly one instance, braces@3.0.3, flagged dev, on the single path
keiko-ui devDependency eslint-config-next@16.3.6 -> @next/eslint-plugin-next@16.3.6 ->
fast-glob@3.3.1 -> micromatch@4.0.8. `npm ls --omit=dev --all braces` is empty. The plugin calls
fast-glob only in dist/utils/get-root-dirs.js, expanding the `settings.next.rootDir` value of the
ESLint configuration this repository authors, and only while the keiko-ui lint runs. Neither the
distributed package nor the UI's static export contains it, so no user and no untrusted input
reaches the recursive walkers; the worst case is a lint process crashed by a pattern a committer
wrote.

No upgrade path exists: micromatch 4.0.8 is the latest release and requires braces ^3.0.3, and the
latest @next/eslint-plugin-next (16.3.8) still pins fast-glob 3.3.1.

Revisit condition: drop this entry as soon as braces publishes a patched release, or once
@next/eslint-plugin-next stops depending on micromatch. Recorded during #3534 (PR #3679): GitHub
reviewed the advisory on 2026-10-02 at 22:36 UTC, after the last green scan on dev, and OSV began
matching it minutes later.
"""
