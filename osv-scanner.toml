# OSV Scanner triage record (ADR-0002 supply-chain baseline).
#
# The `Scan dependency lockfiles` gate stays fail-closed: every entry below is an explicit,
# time-boxed decision with a recorded reason, not a blanket suppression. `ignoreUntil` forces the
# entry back through this gate on that date, so a stale waiver cannot outlive its justification.
# Nothing here weakens the scan for shipped dependencies — only build-time-only findings may be
# recorded: ones with no upstream fix, or whose patched release cannot be adopted without a separately
# governed gate change (that entry names the change and its follow-up). Each must state why it cannot
# reach a user.
#
# Each entry is bound to one advisory id, never to a package: a `[[PackageOverrides]]` rule would
# also hide every present and future advisory of that package, and osv-scanner cannot express
# "this id AND only in the dev group". A different advisory against the same package still fails.
#
# History: the GHSA-mh99-v99m-4gvg brace-expansion waiver (recorded during #2696, PR #2700) was
# removed when its own revisit condition arrived: upstream shipped patched releases on both
# affected lines and the lockfile moved to 1.1.18/5.0.9, so the id-wide suppression would only
# have hidden a reintroduced vulnerable release from the one gate positioned to catch it. The
# fallow GHSA-h4fr-cmh5-qr62 and GHSA-jfwm-3p3c-6hx5 waivers (#3898) were removed on their revisit
# condition: the owner decided the duplication gate (generated files excluded, the rest frozen in a
# shrink-only baseline, `scripts/check-semantic-duplication.mjs`) and fallow moved to 3.35.0.
# The braces GHSA-vfj7-8cjw-p6xm waiver (#3534, PR #3679) and the minimatch GHSA-g3hv-75wg-m249
# waiver (#3907, PR #4167) were retired on 2026-11-23 (#4538) because neither matched anything any
# longer: GitHub withdrew the braces advisory on 2026-10-23 (OSV `withdrawn` 2026-10-23T12:53:02Z),
# and the minimatch advisory affects only 7.0.0 up to but excluding 11.0.1, so neither locked copy
# (11.0.8, and the dev-only 3.1.5 under eslint-config-next) is in range; the entry's reason text
# wrongly claimed "every minimatch before 11.0.1". An ignore that matches nothing only hides a
# reintroduced vulnerable release, so both ids now fail the scan again if they ever apply.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-01
reason = """
picomatch regular-expression denial of service through single-branch repeated extglobs (CWE-1333,
high; CVSS 8.7). Build-time only and unfixable upstream at the time of writing: the advisory covers
every release through 4.0.7, which is the latest published picomatch, and names no patched version.

Reach: the lockfile holds two instances, both flagged dev: picomatch@4.0.7 for dependency-cruiser,
fdir, tinyglobby, jest-util, jest-message-util, knip, vite and vitest, and picomatch@2.3.2 for
micromatch@4.0.8 (the eslint-config-next -> @next/eslint-plugin-next -> fast-glob path).
`npm ls --omit=dev --all picomatch` is empty, and neither `dist/` nor the UI's static export
contains it. These tools compile glob patterns from configuration this repository authors (test
include globs, the dependency-cruiser and knip rules, Vite's file watching) and match them against
repository paths while a build, a lint or a test runs. No user and no untrusted input supplies a
pattern; the worst case is a slow developer or CI process over a pattern a committer wrote.

No upgrade path exists: 4.0.7 is the latest release on the only maintained line, and every
consumer above already resolves to it or to micromatch's latest 2.x requirement.

Revisit condition: drop this entry as soon as picomatch publishes a patched release and the
lockfile moves to it. Recorded during #4455 (PR #4460): GitHub updated the advisory on 2026-11-17
at 15:56 UTC to cover 4.0.7, after the last green scan on dev, and OSV matched it from then on.
"""
