# OSV Scanner triage record (ADR-0002 supply-chain baseline).
#
# The `Scan dependency lockfiles` gate stays fail-closed: every entry below is an explicit,
# time-boxed decision with a recorded reason, not a blanket suppression. `ignoreUntil` forces the
# entry back through this gate on that date, so a stale waiver cannot outlive its justification.
# Nothing here weakens the scan for shipped dependencies — only build-time-only findings that have
# no upstream fix may be recorded, and each must state why it cannot reach a user.
#
# Each entry is bound to one advisory id, never to a package: a `[[PackageOverrides]]` rule would
# also hide every present and future advisory of that package, and osv-scanner cannot express
# "this id AND only in the dev group". A different advisory against the same package still fails.
#
# History: the GHSA-mh99-v99m-4gvg brace-expansion waiver (recorded during #2696, PR #2700) was
# removed when its own revisit condition arrived: upstream shipped patched releases on both
# affected lines and the lockfile moved to 1.1.18/5.0.9, so the id-wide suppression would only
# have hidden a reintroduced vulnerable release from the one gate positioned to catch it.

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-11-30
reason = """
GitHub reports that http-cache-semantics max-stale handling discloses security-zeroed shared-cache
entries across users (CVE-2026-93748, high; CVSS 3.1 7.5, CVSS 4.0 8.7). Rechecked 2026-10-05:
the advisory remains unwithdrawn, covers releases through 4.2.0, and names no patched version:
https://github.com/advisories/GHSA-ch52-4w7c-c8xp
Version 4.3.0 was published on 2026-10-04 and is now the latest registry release:
https://registry.npmjs.org/http-cache-semantics

Reach: the lockfile holds exactly one instance, http-cache-semantics@4.2.0, flagged dev, on the
single path root devDependency sigstore@5.0.0 -> @sigstore/sign@5.0.0 -> make-fetch-happen@16.0.1.
`npm ls --omit=dev --all http-cache-semantics` is empty. The only importer of sigstore is
scripts/sign-linux-runtime-qualification.mjs, release tooling that is never distributed. Even there
the vulnerable code cannot run: @sigstore/sign calls make-fetch-happen without a `cachePath`, and
make-fetch-happen's CachePolicy.storable() returns false for such a request before it constructs an
http-cache-semantics policy, so nothing is ever stored in or served from a cache. make-fetch-happen
also configures the library as a private cache (`shared: false`), while the advisory concerns a
shared cache that serves several users.

The locked dev-only resolution remains 4.2.0. The newer release is not an identified security fix
in the advisory. The maintainer disputes the report; that does not withdraw the GitHub advisory
or resolve the open Dependabot alert #34:
https://github.com/kornelski/http-cache-semantics/issues/56#issuecomment-5975759591
https://github.com/oscharko-dev/Keiko/security/dependabot/34

Revisit condition: drop this entry as soon as http-cache-semantics publishes a patched release, or
once @sigstore/sign stops depending on make-fetch-happen. Recorded during #3534 (PR #3679): GitHub
reviewed the advisory on 2026-10-02 at 22:36 UTC, after the last green scan on dev, and OSV began
matching it minutes later.
"""
