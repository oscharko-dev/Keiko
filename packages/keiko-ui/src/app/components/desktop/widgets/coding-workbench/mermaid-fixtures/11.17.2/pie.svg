<svg id="keiko-diagram-3" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546.96875 450" style="max-width: 546.96875px;" role="graphics-document document" aria-roledescription="pie"><style>#keiko-diagram-3{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#keiko-diagram-3 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#keiko-diagram-3 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#keiko-diagram-3 .error-icon{fill:#a44141;}#keiko-diagram-3 .error-text{fill:#ddd;stroke:#ddd;}#keiko-diagram-3 .edge-thickness-normal{stroke-width:1px;}#keiko-diagram-3 .edge-thickness-thick{stroke-width:3.5px;}#keiko-diagram-3 .edge-pattern-solid{stroke-dasharray:0;}#keiko-diagram-3 .edge-thickness-invisible{stroke-width:0;fill:none;}#keiko-diagram-3 .edge-pattern-dashed{stroke-dasharray:3;}#keiko-diagram-3 .edge-pattern-dotted{stroke-dasharray:2;}#keiko-diagram-3 .marker{fill:lightgrey;stroke:lightgrey;}#keiko-diagram-3 .marker.cross{stroke:lightgrey;}#keiko-diagram-3 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#keiko-diagram-3 p{margin:0;}#keiko-diagram-3 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#keiko-diagram-3 .pieCircle.highlighted{scale:1.05;opacity:1;}#keiko-diagram-3 .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#keiko-diagram-3 .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#keiko-diagram-3 .pieTitleText{text-anchor:middle;font-size:25px;fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;}#keiko-diagram-3 .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#ccc;font-size:17px;}#keiko-diagram-3 .legend text{fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#keiko-diagram-3 .node .neo-node{stroke:#ccc;}#keiko-diagram-3 [data-look="neo"].node rect,#keiko-diagram-3 [data-look="neo"].cluster rect,#keiko-diagram-3 [data-look="neo"].node polygon{stroke:url(#keiko-diagram-3-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#keiko-diagram-3 [data-look="neo"].swimlane.cluster rect{filter:none;}#keiko-diagram-3 [data-look="neo"].node path{stroke:url(#keiko-diagram-3-gradient);stroke-width:1px;}#keiko-diagram-3 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#keiko-diagram-3 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#keiko-diagram-3 [data-look="neo"].node circle{stroke:url(#keiko-diagram-3-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#keiko-diagram-3 [data-look="neo"].node circle .state-start{fill:#000000;}#keiko-diagram-3 [data-look="neo"].icon-shape .icon{fill:url(#keiko-diagram-3-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#keiko-diagram-3 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#keiko-diagram-3-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#keiko-diagram-3 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-167.623,-78.278L0,0Z" fill="#0b0000" class="pieCircle"></path><path d="M-167.623,-78.278A185,185,0,0,1,0,-185L0,0Z" fill="#4d1037" class="pieCircle"></path><text transform="translate(74.5177955801092,117.04127751302553)" class="slice" style="text-anchor: middle;">82%</text><text transform="translate(-74.51779558010921,-117.04127751302553)" class="slice" style="text-anchor: middle;">18%</text></g><text x="0" y="-200" class="pieTitleText">Pets</text><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(11, 0, 0); stroke: rgb(11, 0, 0);"></rect><text x="22" y="14">Dogs</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(77, 16, 55); stroke: rgb(77, 16, 55);"></rect><text x="22" y="14">Cats</text></g></g></svg>
