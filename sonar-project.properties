# SonarCloud CI-based analysis configuration (ADR-0131, hardened by ADR-0134).
#
# sonar.projectVersion is intentionally NOT set here — it is resolved at scan time from
# package.json and passed via -Dsonar.projectVersion in the CI scan step, so the New Code
# Definition ("previous_version" mode) has a real value on every analysis instead of "not provided".
sonar.projectKey=oscharko-dev_Keiko
sonar.organization=oscharko-dev
sonar.projectName=Keiko
sonar.sourceEncoding=UTF-8

# SonarJS resolves TypeScript projects in a separate discovery pass that does not honor
# sonar.exclusions. Without an explicit set it also loads tsconfigs from local `.keiko` task
# workspaces, doubling the compiler graph and exhausting the local analyzer heap. These patterns
# cover every productive repository tsconfig while keeping local runtime state out of the graph.
sonar.typescript.tsconfigPaths=tsconfig.json,packages/*/tsconfig.json,tests/e2e/servers/tsconfig.json

# The CLI scanner otherwise treats the repository root as one undifferentiated main-code tree.
# Keep sources and tests explicit and disjoint: sonar.test.inclusions also removes the matching
# paths from main-code scope, while sonar.exclusions pins that behavior for scanner upgrades.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,**/__tests__/**,**/testing/**,**/*.test.*,**/*.spec.*,**/_support.*,**/test-support.*,**/test-support/**,**/test-fixtures.*,**/testing.*,native/secure-workspace-read/test-protocol.mjs,native/runtime-supervisor/test-protocol.mjs,native/runtime-supervisor/macos/test-protocol.mjs,native/runtime-supervisor/protocol-harness.mjs
sonar.test.exclusions=native/portable-launcher/**,scripts/native-quality/**,packages/keiko-quality-intelligence/src/export/__tests__/textSafety.test.ts,**/*.c,**/*.cc,**/*.cxx,**/*.h,**/*.hh,**/*.m,**/*.mm,**/*.cs,**/*.7z,**/*.aiff,**/*.avi,**/*.bin,**/*.bmp,**/*.class,**/*.dll,**/*.dmg,**/*.dylib,**/*.eot,**/*.exe,**/*.gif,**/*.gz,**/*.icns,**/*.ico,**/*.jpg,**/*.jpeg,**/*.m4a,**/*.map,**/*.mov,**/*.mp3,**/*.mp4,**/*.obj,**/*.ogg,**/*.otf,**/*.pdf,**/*.png,**/*.so,**/*.svg,**/*.tar,**/*.tgz,**/*.tif,**/*.tiff,**/*.ttf,**/*.wasm,**/*.wav,**/*.webm,**/*.webp,**/*.woff,**/*.woff2,**/*.zip
sonar.exclusions=tests/**,**/__tests__/**,**/testing/**,**/*.test.*,**/*.spec.*,**/_support.*,**/test-support.*,**/test-support/**,**/test-fixtures.*,**/testing.*,**/dist/**,**/node_modules/**,**/coverage/**,**/.next/**,**/out/**,**/.keiko/**,**/.codex/**,**/.claude/**,**/.portable-runtime/**,docs/design-system/evidence/**,native/portable-launcher/**,scripts/native-quality/**,scripts/windows-portable-rfc3161.cs,scripts/arch-check-negative.mjs,native/secure-workspace-read/secure_workspace_read.c,native/runtime-supervisor/windows/keiko_runtime_supervisor.c,native/runtime-supervisor/windows/qualification_fixture.c,native/runtime-attestation/windows/keiko_runtime_attestation.c,native/runtime-supervisor/macos/keiko_runtime_monitor_protocol.h,native/runtime-supervisor/macos/keiko_runtime_supervisor.c,native/runtime-supervisor/macos/qualification_fixture.c,native/runtime-supervisor/macos/system-extension/keiko_runtime_monitor.m,native/runtime-supervisor/macos/system-extension/keiko_system_extension_manager.m,native/secure-workspace-read/test-protocol.mjs,native/runtime-supervisor/test-protocol.mjs,native/runtime-supervisor/macos/test-protocol.mjs,native/runtime-supervisor/protocol-harness.mjs,**/*.c,**/*.cc,**/*.cxx,**/*.h,**/*.hh,**/*.m,**/*.mm,**/*.cs,**/*.d.ts,**/*.generated.*,**/*.min.*,**/*.7z,**/*.aiff,**/*.avi,**/*.bin,**/*.bmp,**/*.class,**/*.dll,**/*.dmg,**/*.dylib,**/*.eot,**/*.exe,**/*.gif,**/*.gz,**/*.icns,**/*.ico,**/*.jpg,**/*.jpeg,**/*.m4a,**/*.map,**/*.mov,**/*.mp3,**/*.mp4,**/*.obj,**/*.ogg,**/*.otf,**/*.pdf,**/*.png,**/*.so,**/*.svg,**/*.tar,**/*.tgz,**/*.tif,**/*.tiff,**/*.ttf,**/*.wasm,**/*.wav,**/*.webm,**/*.webp,**/*.woff,**/*.woff2,**/*.zip
# Locale catalogs intentionally repeat message keys across languages; TypeScript keeps key
# parity strict (enforced by check:ui-i18n), while CPD would otherwise count the parallel
# translation entries as duplicated code. This covers both the shared i18n-messages.*.ts
# catalogs and the co-located feature catalogs — the *-i18n.ts single-file catalogs and the
# split *-i18n.de.ts / *-i18n.en.ts language pairs (e.g. the Coding Workbench boundary, #2257).
# The RFC3161 and native-policy PowerShell fixtures are test code; excluding those exact paths
# prevents Sonar CPD from warning that duplication findings for correctly classified test files
# must be discarded.
#
# The keiko-evaluations fixture catalogs are hand-written ground truth for the retrieval and
# grounding gates, and they repeat a nested literal shape (capsule > source > document > parsed
# unit > chunk) once per scenario. What repeats is the schema, not logic: `source-isolation` and
# `wrong-scope` are structurally identical and semantically unrelated, and every id, name, body and
# topic differs. Collapsing them behind builders would shorten the file at the cost of the property
# that matters most in ground-truth data — that a reader can see one whole scenario in one place —
# and would edit eval expectations as a side effect of unrelated work. CPD counts the shared shape
# as duplication regardless, so exempt the catalogs and let TypeScript keep them honest instead.
sonar.cpd.exclusions=packages/keiko-ui/src/lib/i18n-messages.*.ts,packages/keiko-ui/src/**/*-i18n.ts,packages/keiko-ui/src/**/*-i18n.de.ts,packages/keiko-ui/src/**/*-i18n.en.ts,scripts/__tests__/windows-rfc3161-fixtures.ps1,scripts/__tests__/windows-native-policy-fixtures.ps1,packages/keiko-evaluations/src/**/fixtures.ts,packages/keiko-evaluations/src/**/fixtures/**

# S4790 flags SHA-1 as a weak hashing algorithm. The single flagged site is `gitBlobFingerprint`,
# which computes git's own blob object id (`sha1("blob <len>\0" + bytes)`) so the repository pod can
# ask git's index whether a tracked file changed. SHA-1 is not a security choice there — it is
# git's object format, and the value is useful only because it equals what `git hash-object`
# reports, which a stronger digest would not. It never authenticates, signs, or protects anything;
# a collision would at worst make one file look unchanged to an incremental re-index. The test
# beside it pins real `git hash-object` output to keep that equality honest. Scoped to the one file
# that owns the computation, so any new SHA-1 use anywhere else still fails the gate.
sonar.issue.ignore.multicriteria=gitblobsha1,ariatreegroup,arialistboxgroup,infrafailureretrycheckout,benchsettlewaits,benchscaleskip
sonar.issue.ignore.multicriteria.gitblobsha1.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.gitblobsha1.resourceKey=packages/keiko-local-knowledge/src/indexing/repository-fingerprints.ts
# S6819 ("prefer semantic elements over the group role") is a false positive inside composite
# ARIA widgets: role="group" is the W3C-mandated subtree container inside role="tree"
# (MultiRootFilesWidget) and the mandated option-group container inside role="listbox"
# (SearchResultList). Replacing it with <fieldset>/<details> would BREAK the required
# tree > treeitem/group and listbox > group > option composition. The multi-root tree's known
# aria-required-children finding is tracked as #2605 and pinned by the #2533 closeout journey.
sonar.issue.ignore.multicriteria.ariatreegroup.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.ariatreegroup.resourceKey=packages/keiko-ui/src/app/components/desktop/widgets/cards/MultiRootFilesWidget.tsx
sonar.issue.ignore.multicriteria.arialistboxgroup.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.arialistboxgroup.resourceKey=packages/keiko-ui/src/app/components/desktop/widgets/panels/SearchResultList.tsx
# S7631 ("no untrusted code executed from a fork") anchors on the `actions/checkout` reference and
# names `workflow_run:` as the reason, so it fires on the SHAPE - a privileged trigger plus any
# checkout - and not on where the checkout points. The infrastructure-signature observer (ADR-0161)
# cannot avoid that shape: `workflow_run` is the only trigger GitHub offers for observing a run that
# has already completed, and the classifier it runs is repository code that has to be checked out.
# What the rule warns about is absent by construction and asserted by test: `ref` is pinned to
# `github.event.repository.default_branch`, never `workflow_run.head_sha`; no artifact of the
# observed run is downloaded; the run id and mode reach the process through `env:` indirection and
# are re-validated before either can reach an API path; and the one privileged call the job can make,
# `rerun-failed-jobs`, re-executes the same tree that already ran and cannot introduce code.
# scripts/__tests__/check-infra-failure-signature.test.mjs pins the default-branch checkout, the
# absence of a head_sha ref, and `actions: write` as the only write grant. The same acceptance is
# recorded line-anchored for zizmor's `dangerous-triggers` in .github/zizmor.yml and verified by
# `npm run check:zizmor-anchors`. Scoped to this one workflow file, so any other privileged
# checkout anywhere still fails the gate; deleting the observer file makes this entry dead.
sonar.issue.ignore.multicriteria.infrafailureretrycheckout.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.infrafailureretrycheckout.resourceKey=.github/workflows/infra-failure-retry.yml
# S2925 ("replace this fixed wait with a synchronization on an observable condition") assumes the
# sleep waits FOR something. In the workspace wall-clock benchmark the 450 ms idle-settle windows
# ARE the measurement design (GEN-PERF-BENCHMARK-004): the gesture-phase boundary is frozen before
# the settle so p75 reflects the gesture rather than the steady idle frames, and the elapsed time is
# the subject itself — there is no observable condition whose arrival would make the wait obsolete.
# Scoped to the one benchmark file; a fixed wait anywhere else still fails the rule.
sonar.issue.ignore.multicriteria.benchsettlewaits.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.benchsettlewaits.resourceKey=tests/e2e/workspace-performance.spec.ts
# S1607 ("remove this unit test or explain why it is ignored") is satisfied in substance: the scale
# tier uses Playwright's conditional `test.skip(condition, reason)` WITH the reason string
# ("set KEIKO_PERF_SCALE_WINDOWS>=20 ..."); the rule just does not recognize that signature.
sonar.issue.ignore.multicriteria.benchscaleskip.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.benchscaleskip.resourceKey=tests/e2e/workspace-performance.spec.ts
# Files under packages/keiko-ui/public/ are static assets served verbatim by Next.js — they
# never pass through a bundler and are not reachable from Node/jsdom unit tests (AudioWorklets
# and service workers only load in the browser's dedicated realms). Keep them in the analysis
# for rule findings, but exempt them from the coverage requirement.
# scripts/arch-check-negative.mjs is a top-level orchestration script that runs dep-cruiser
# and the import-policy checker via `spawnSync`; v8 coverage never crosses the subprocess
# boundary. Its testable logic is extracted into `scripts/lib/bare-specifier-visibility-probe.mjs`
# and covered by its own pod; the remaining orchestration is exercised end-to-end by
# `npm run arch:check:negative` in CI. Exempt it from the new-code coverage requirement,
# same rationale pattern as the packages/keiko-ui/public/ exemption above.
sonar.coverage.exclusions=packages/keiko-ui/public/**,scripts/arch-check-negative.mjs

sonar.javascript.lcov.reportPaths=coverage/packages/lcov.info,packages/keiko-ui/coverage/lcov.info,coverage/scripts/lcov.info

# The JS/TS analyzer's Node.js process auto-sizes its heap from available system memory, which
# has repeatedly undershot on the full-branch (push-to-dev) analysis as the repository has grown:
# a full-project scan holds every source file's AST at once, unlike a pull-request scan which
# only analyzes the changed-file diff. The default sizing hit its heap ceiling at ~4.3 GB and
# aborted the analysis (java.lang.IllegalStateException: Analysis of JS/TS files failed, caused by
# an out-of-memory gRPC disconnect) on nearly every push-to-dev run starting 2026-07-17, well
# below the GitHub-hosted ubuntu-latest runner's 16 GB. Pin an explicit ceiling with real headroom
# instead of relying on auto-detection.
sonar.javascript.node.maxspace=10240

# This repository contains no PL/SQL source. Without a Data Dictionary, the bundled PLSQL
# analyzer otherwise always emits a scanner WARN (rules S3641, S3921, S3618, S3651 disabled),
# which the CI aggregate gate treats as a scanner-log failure. Disable the PLSQL analyzer
# entirely by clearing its file suffixes so the warning cannot be emitted.
sonar.plsql.file.suffixes=-
