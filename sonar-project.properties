# SonarCloud CI-based analysis configuration (ADR-0131, hardened by ADR-0134).
#
# sonar.projectVersion is intentionally NOT set here — it is resolved at scan time from
# package.json and passed via -Dsonar.projectVersion in the CI scan step, so the New Code
# Definition ("previous_version" mode) has a real value on every analysis instead of "not provided".
sonar.projectKey=oscharko-dev_Keiko
sonar.organization=oscharko-dev
sonar.projectName=Keiko
sonar.sourceEncoding=UTF-8

# The CLI scanner otherwise treats the repository root as one undifferentiated main-code tree.
# Keep sources and tests explicit and disjoint: sonar.test.inclusions also removes the matching
# paths from main-code scope, while sonar.exclusions pins that behavior for scanner upgrades.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,**/__tests__/**,**/testing/**,**/*.test.*,**/*.spec.*,**/_support.*,**/test-support.*,**/test-fixtures.*,**/testing.*,native/secure-workspace-read/test-protocol.mjs,native/runtime-supervisor/test-protocol.mjs
sonar.test.exclusions=native/portable-launcher/**,scripts/native-quality/**,packages/keiko-quality-intelligence/src/export/__tests__/textSafety.test.ts,**/*.c,**/*.cc,**/*.cxx,**/*.h,**/*.hh,**/*.cs,**/*.7z,**/*.aiff,**/*.avi,**/*.bin,**/*.bmp,**/*.class,**/*.dll,**/*.dmg,**/*.dylib,**/*.eot,**/*.exe,**/*.gif,**/*.gz,**/*.icns,**/*.ico,**/*.jpg,**/*.jpeg,**/*.m4a,**/*.map,**/*.mov,**/*.mp3,**/*.mp4,**/*.obj,**/*.ogg,**/*.otf,**/*.pdf,**/*.png,**/*.so,**/*.svg,**/*.tar,**/*.tgz,**/*.tif,**/*.tiff,**/*.ttf,**/*.wasm,**/*.wav,**/*.webm,**/*.webp,**/*.woff,**/*.woff2,**/*.zip
sonar.exclusions=tests/**,**/__tests__/**,**/testing/**,**/*.test.*,**/*.spec.*,**/_support.*,**/test-support.*,**/test-fixtures.*,**/testing.*,**/dist/**,**/node_modules/**,**/coverage/**,**/.next/**,**/out/**,**/.codex/**,**/.claude/**,**/.portable-runtime/**,docs/design-system/evidence/**,native/portable-launcher/**,scripts/native-quality/**,scripts/windows-portable-rfc3161.cs,native/secure-workspace-read/secure_workspace_read.c,native/runtime-supervisor/windows/keiko_runtime_supervisor.c,native/runtime-supervisor/windows/qualification_fixture.c,native/secure-workspace-read/test-protocol.mjs,native/runtime-supervisor/test-protocol.mjs,**/*.c,**/*.cc,**/*.cxx,**/*.h,**/*.hh,**/*.cs,**/*.d.ts,**/*.generated.*,**/*.min.*,**/*.7z,**/*.aiff,**/*.avi,**/*.bin,**/*.bmp,**/*.class,**/*.dll,**/*.dmg,**/*.dylib,**/*.eot,**/*.exe,**/*.gif,**/*.gz,**/*.icns,**/*.ico,**/*.jpg,**/*.jpeg,**/*.m4a,**/*.map,**/*.mov,**/*.mp3,**/*.mp4,**/*.obj,**/*.ogg,**/*.otf,**/*.pdf,**/*.png,**/*.so,**/*.svg,**/*.tar,**/*.tgz,**/*.tif,**/*.tiff,**/*.ttf,**/*.wasm,**/*.wav,**/*.webm,**/*.webp,**/*.woff,**/*.woff2,**/*.zip
# Locale catalogs intentionally repeat message keys across languages; TypeScript keeps key
# parity strict (enforced by check:ui-i18n), while CPD would otherwise count the parallel
# translation entries as duplicated code. This covers both the shared i18n-messages.*.ts
# catalogs and the co-located feature catalogs — the *-i18n.ts single-file catalogs and the
# split *-i18n.de.ts / *-i18n.en.ts language pairs (e.g. the Coding Workbench boundary, #2257).
# The RFC3161 and native-policy PowerShell fixtures are test code; excluding those exact paths
# prevents Sonar CPD from warning that duplication findings for correctly classified test files
# must be discarded.
sonar.cpd.exclusions=packages/keiko-ui/src/lib/i18n-messages.*.ts,packages/keiko-ui/src/**/*-i18n.ts,packages/keiko-ui/src/**/*-i18n.de.ts,packages/keiko-ui/src/**/*-i18n.en.ts,scripts/__tests__/windows-rfc3161-fixtures.ps1,scripts/__tests__/windows-native-policy-fixtures.ps1
# Files under packages/keiko-ui/public/ are static assets served verbatim by Next.js — they
# never pass through a bundler and are not reachable from Node/jsdom unit tests (AudioWorklets
# and service workers only load in the browser's dedicated realms). Keep them in the analysis
# for rule findings, but exempt them from the coverage requirement.
sonar.coverage.exclusions=packages/keiko-ui/public/**

sonar.javascript.lcov.reportPaths=coverage/packages/lcov.info,packages/keiko-ui/coverage/lcov.info,coverage/scripts/lcov.info

# The JS/TS analyzer's Node.js process auto-sizes its heap from available system memory, which
# has repeatedly undershot on the full-branch (push-to-dev) analysis as the repository has grown:
# a full-project scan holds every source file's AST at once, unlike a pull-request scan which
# only analyzes the changed-file diff. The default sizing hit its heap ceiling at ~4.3 GB and
# aborted the analysis (java.lang.IllegalStateException: Analysis of JS/TS files failed, caused by
# an out-of-memory gRPC disconnect) on nearly every push-to-dev run starting 2026-07-17, well
# below the GitHub-hosted ubuntu-latest runner's 16 GB. Pin an explicit ceiling with real headroom
# instead of relying on auto-detection.
sonar.javascript.node.maxspace=10240

# This repository contains no PL/SQL source. Without a Data Dictionary, the bundled PLSQL
# analyzer otherwise always emits a scanner WARN (rules S3641, S3921, S3618, S3651 disabled),
# which the CI aggregate gate treats as a scanner-log failure. Disable the PLSQL analyzer
# entirely by clearing its file suffixes so the warning cannot be emitted.
sonar.plsql.file.suffixes=-
